<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/*
VOICE: speels, warm, een gezellige spelavond aan de keukentafel.
IDEA: een spellenkast; elk spel is een doos. Eilanders is een eiland in een diepe zee.
PICTURE: het zeshoekige eiland zelf is het beeld; op de hoofdpagina een stapel tegels met dobbelstenen.
COLOUR and TYPE: diep zeeblauw-groen dominant, zand als steun, koraal als accent. Baloo 2 + Nunito.
LAYOUT: telefoon eerst; bord bovenaan, hand en knoppen onderin binnen duimbereik.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f4e9cf,#0c2a33);--panel:light-dark(#fffaf0,#123a46);--panel2:light-dark(#efe2c3,#0f323d);
--ink:light-dark(#1f2a2e,#f3ecdc);--mute:light-dark(#5d6a6e,#a9bcc0);--line:light-dark(#dccca6,#24525f);
--sea:#0e5a73;--sea2:#0a4253;--shallow:#2f86a0;--coral:#e4572e;--coral2:#c9431d;--sand:#f4e6c4}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:46px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;font-weight:800;background:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral2);width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral2)}
.btn.alt{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.sea{background:var(--sea);box-shadow:0 3px 0 var(--sea2)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.muted{color:var(--mute)}.small{font-size:14px}
/* hub */
.hero{background:radial-gradient(120% 90% at 70% 10%,#1a7690 0%,var(--sea) 45%,var(--sea2) 100%);color:#fbf3df;padding:28px 0 0;overflow:hidden}
.hero .wrap{display:grid;gap:6px}
.hero h1{font-size:clamp(44px,12vw,64px);font-weight:800;letter-spacing:-.5px}
.hero p{margin:0;font-size:17px;color:#cfe6ea;max-width:30ch}
.hero svg{display:block;width:100%;height:auto;margin-top:8px}
.games{display:grid;gap:14px;padding:22px 0 40px}
.gcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line);width:100%}
.gcard h2{font-size:26px}.gcard p{margin:2px 0 0;color:var(--mute);font-size:15px}
.gcard .tag{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;color:var(--coral)}
.gcard.soon{border-style:dashed;box-shadow:none;opacity:.8;cursor:default}
.gcard svg{width:96px;height:96px}
/* menu */
.mhead{background:var(--sea);color:#fbf3df;padding:14px 0 18px}
.mhead .row{display:flex;align-items:center;gap:10px}
.back{min-height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:800}
.mhead h1{font-size:40px;margin-top:8px}
.mhead p{margin:4px 0 0;color:#cfe6ea}
.stack{display:grid;gap:12px;padding:20px 0 40px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.card h3{font-size:22px}
.note{font-size:14px;color:var(--mute);margin:0}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);font-weight:800;background:var(--panel)}
.seg button.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.code{font-family:"Baloo 2";font-size:56px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--coral)}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);font-weight:700}
.dot{width:18px;height:18px;border-radius:6px;flex:none;border:2px solid rgba(0,0,0,.35)}
/* game */
.g{max-width:720px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.gtop{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sea);color:#fff}
.gtop .ttl{flex:1;font-weight:800;font-size:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;min-height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;padding:0 10px}
.pls{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:8px 8px 4px}
.pl{border-radius:12px;background:var(--panel);border:2px solid var(--line);padding:6px 7px;display:grid;gap:2px;font-size:13px;line-height:1.2}
.pl.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral) inset}
.pl .nm{display:flex;align-items:center;gap:5px;font-weight:800;white-space:nowrap;overflow:hidden}
.pl .nm span{overflow:hidden;text-overflow:ellipsis}
.pl .dot{width:12px;height:12px;border-radius:4px}
.pl .st{display:flex;gap:7px;color:var(--mute);font-weight:700;flex-wrap:wrap}
.pl .vp{color:var(--ink);font-weight:800}
.bdg{display:inline-block;padding:0 5px;border-radius:6px;background:var(--coral);color:#fff;font-size:11px;font-weight:800}
.status{margin:4px 8px;padding:9px 12px;border-radius:12px;background:var(--panel2);font-weight:800;font-size:15px;text-align:center;min-height:42px}
.status.me{background:var(--coral);color:#fff}
.bw{position:relative;margin:0 8px;border-radius:22px;background:radial-gradient(circle at 50% 45%,var(--shallow),var(--sea) 60%,var(--sea2));overflow:hidden}
.bw svg{display:block;width:100%;height:auto;touch-action:manipulation}
.dice{position:absolute;left:8px;top:8px;display:flex;gap:5px}
.dice svg{width:30px;height:30px}
.logl{margin:6px 12px 0;color:var(--mute);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.logbtn{position:absolute;right:8px;top:8px;min-height:36px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:13px}
.hand{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:8px 8px 4px}
.rc{border-radius:10px;padding:4px 2px 3px;display:grid;justify-items:center;gap:0;font-weight:800;color:#1d2427;border:2px solid rgba(0,0,0,.15);font-size:17px;line-height:1.1}
.rc svg{width:28px;height:28px}
.rc small{font-size:11px;font-weight:700;opacity:.85}
.rc.dev{background:var(--panel);color:var(--ink);border-color:var(--line)}
.rc.zero{opacity:.45}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 8px 12px}
.ab{min-height:58px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:13px;display:grid;justify-items:center;align-content:center;gap:3px;padding:4px 2px;line-height:1.1}
.ab.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.ab.pri{background:var(--coral);border-color:var(--coral2);color:#fff}
.ab:disabled{opacity:.4;cursor:default}
.ab.wide{grid-column:span 2}
.cost{display:flex;gap:2px}.cost i{width:9px;height:9px;border-radius:3px;border:1px solid rgba(0,0,0,.3)}
.offer{margin:0 8px 6px;padding:10px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--coral);display:grid;gap:8px;font-weight:700}
.offer .row{display:flex;gap:8px}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(5,20,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}.tgt{animation:none!important}}
.sh h2{font-size:26px}
.shx{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{min-width:44px;min-height:44px;border-radius:12px;background:var(--panel2);font-weight:800;font-size:20px}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpick{border-radius:12px;padding:6px 2px;display:grid;justify-items:center;font-weight:800;color:#1d2427;border:3px solid transparent;font-size:13px;min-height:64px}
.rpick svg{width:30px;height:30px}
.rpick.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.rpick:disabled{opacity:.35}
.step{display:grid;justify-items:center;gap:4px}
.step .n{font-weight:800;font-size:18px}
.step .pm{display:flex;gap:4px}
.step .pm button{width:32px;height:34px;border-radius:9px;background:var(--panel);border:2px solid var(--line);font-weight:800}
.lbl{font-weight:800;font-size:15px}
.dl{display:grid;gap:8px}
.drow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--line)}
.drow .t{flex:1}.drow b{display:block}.drow span{font-size:14px;color:var(--mute)}
.drow .btn{width:auto;min-height:42px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;min-height:44px;border-radius:12px;font-weight:800;background:var(--panel2)}
.tabs button.on{background:var(--sea);color:#fff}
.rules p{margin:0 0 8px}.rules h3{font-size:19px;margin:12px 0 4px}
.logfull{display:grid;gap:4px;font-size:14px}
.cover{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--sea);color:#fff;text-align:center;padding:24px}
.cover h2{font-size:34px;margin:12px 0}
.cover .btn{max-width:320px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2427;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;z-index:40;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.tgt{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.win{text-align:center}.win h2{font-size:34px}
.score{display:grid;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gtop .ib{flex:none}
.empty{color:var(--mute);font-size:14px;margin:6px;text-align:center;width:100%}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px;width:auto}
.sec{padding:4px 10px;display:grid;gap:6px}
/* tegelrummy */
.felt{margin:4px 8px;padding:10px 8px;border-radius:18px;background:#2f7a55;min-height:120px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;position:relative}
.potc{position:absolute;right:10px;top:-10px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;font-weight:800}
.rset{display:flex;gap:2px;padding:4px;border-radius:10px;background:rgba(0,0,0,.18);align-items:center;flex-wrap:wrap}
.rset.bad{background:rgba(220,40,30,.45);outline:2px dashed #ffd3cc}
.tl{width:30px;height:40px;border-radius:6px;background:#f7eed6;border:1px solid #8a7350;box-shadow:0 2px 0 #8a7350;display:grid;place-items:center;font:800 18px/1 "Baloo 2",sans-serif;padding:0}
.tl.sel{transform:translateY(-5px);outline:3px solid var(--coral);outline-offset:1px}
.tadd{width:30px;height:40px;border-radius:6px;border:2px dashed #fff;color:#fff;font-weight:800;font-size:20px}
.tadd:disabled{opacity:.35}
.rack{margin:6px 8px;padding:10px 8px;border-radius:14px;background:#b8875a;display:flex;flex-wrap:wrap;gap:4px;min-height:60px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
/* ezelen */
.ezh{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:14px 10px 4px}
.ez{aspect-ratio:5/7;border-radius:12px;background:#fffaf0;border:3px solid var(--c);display:grid;place-items:center;align-content:center;gap:2px;font-weight:800;color:#2a2016;box-shadow:0 3px 0 rgba(0,0,0,.2);padding:4px}
.ez svg{width:70%;height:auto}
.ez.sel{transform:translateY(-10px);box-shadow:0 0 0 4px var(--coral)}
.ez:not([data-a]){cursor:default}
.grab{display:block;width:calc(100% - 16px);margin:10px 8px;min-height:84px;border-radius:22px;background:var(--coral);color:#fff;font:800 40px/1 "Baloo 2",sans-serif;box-shadow:0 5px 0 var(--coral2)}
.grab:disabled{opacity:.35}
.ltr{display:inline-flex;gap:2px}.ltr b{width:16px;text-align:center;border-radius:4px;background:var(--panel2);color:var(--mute);font-size:12px}.ltr b.on{background:var(--coral);color:#fff}
/* tien fasen */
.fc{--w:50px;width:var(--w);height:calc(var(--w)*1.4);flex:none;border-radius:8px;background:var(--bg,#555);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.2);color:#fff;display:grid;place-items:center;align-content:center;padding:0;font-family:"Baloo 2",sans-serif;line-height:1}
.fc b{font-size:24px}.fc small{font-size:9px;font-weight:800}
.fc.sm{--w:30px;border-width:1px}.fc.sm b{font-size:15px}.fc.sm small{display:none}.fc.sm svg{width:16px;height:16px}
.fc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--coral)}
.fc.dim{opacity:.3}
.fc.back{background:linear-gradient(135deg,#0e5a73,#1a7690)}
.fc.empty{background:transparent;border:2px dashed var(--line);box-shadow:none}
.pile{display:flex;gap:10px;align-items:center;padding:8px 10px}
.pile .mine{display:grid;flex:1;font-size:14px;line-height:1.3}.pile .mine span{color:var(--mute)}
.laid{display:grid;gap:6px;padding:4px 8px}
.lg{display:flex;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:5px 6px}
.lgc{display:flex;flex-wrap:wrap;gap:3px;flex:1}
.lg .tadd{border-color:var(--coral);color:var(--coral);height:42px}
.fhand{display:flex;flex-wrap:wrap;gap:5px;padding:14px 8px 4px;justify-content:center}
/* beverdam */
.bc{--w:62px;width:var(--w);height:calc(var(--w)*1.4);flex:none;border-radius:10px;background:var(--bg,#7a4a26);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.2);color:#fff;display:grid;place-items:center;align-content:center;padding:0;font-family:"Baloo 2",sans-serif;line-height:1}
.bc b{font-size:30px}.bc small{font-size:11px;font-weight:800}
.bc.back{background:repeating-linear-gradient(135deg,#7a4a26 0 8px,#6b3f1f 8px 16px)}
.bc.sm{--w:30px;border-width:1px}.bc.sm b{font-size:16px}.bc.sm small{display:none}
.bc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--coral)}
.bc[data-a]{cursor:pointer}
.opps{display:grid;gap:6px;padding:4px 10px}
.opp{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}.opp>span:nth-child(2){flex:1}
.bhand{padding:10px;display:grid;gap:6px;justify-items:center}
.bhand .row{gap:10px}
/* bonenboer */
.bn{display:grid;justify-items:center;align-content:start;gap:1px;width:78px;min-height:96px;padding:6px 3px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-size:12px;line-height:1.15;position:relative}
.bn b{font-size:12px}
.bn .mt{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.mt i{font-style:normal;font-size:10px;font-weight:800;background:var(--panel2);border-radius:4px;padding:0 3px}
.bn.sm{width:58px;min-height:0;padding:4px 2px}
.bn.sel{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.bn em{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:6px;padding:0 5px}
.bh{flex-wrap:nowrap;overflow-x:auto;padding-top:8px}
.fcol{display:grid;gap:4px;justify-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:6px 8px}
.fld{border-radius:16px;background:#8b5a2b;color:#fff8ea;padding:10px 6px;display:grid;justify-items:center;gap:2px;min-height:150px;align-content:center;text-align:center;border:3px solid transparent}
.fld .note{color:#f1dfbf}.fld .cnt{font:800 30px/1 "Baloo 2",sans-serif}
.fld.can{border-color:#fff;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
.fld.add{background:transparent;border:3px dashed var(--line);color:var(--ink);min-height:150px}.fld.add .note{color:var(--mute)}
.hv{margin-top:4px;min-height:36px;padding:0 10px;border-radius:10px;background:#f4e6c4;color:#3a2a17;font-weight:800;font-size:13px}
.wantg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.wt{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 6px;font-size:13px;font-weight:700}
.wt span{flex:1}.wt .pm{display:flex;align-items:center;gap:4px}
.wt .pm button{width:30px;height:32px;border-radius:8px;background:var(--panel2);font-weight:800}
@media (prefers-reduced-motion:reduce){.fld.can{animation:none}}
.felt .empty{color:#d8efe2}
.fld .mt i{background:rgba(0,0,0,.28);color:#fff}
.bn.sm b{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st{align-items:center}
/* ezelen (eigen variant) */
.et{--w:46px;width:var(--w);height:calc(var(--w)*1.25);flex:none;border-radius:8px;background:#f7eed6;border:1px solid #8a7350;box-shadow:0 3px 0 #8a7350;display:grid;place-items:center;align-content:center;padding:0;font-family:"Baloo 2",sans-serif;line-height:1;position:relative}
.et b{font-size:22px}.et small{position:absolute;bottom:2px;font-size:9px;font-weight:800;color:#6b5a3e}
.et.big{--w:72px}.et.big b{font-size:34px}
.et.back{background:repeating-linear-gradient(135deg,#0e5a73 0 8px,#0a4a5f 8px 16px);color:#fff}.et.back small{color:#cfe6ea}
.et.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--mute);font-weight:800;font-size:15px}
.et.sel{outline:3px solid var(--sea);outline-offset:2px}
.et.tg{outline:3px solid var(--coral);outline-offset:2px;animation:pulse 1.2s ease-in-out infinite}
.emid{margin:6px 8px;padding:10px;border-radius:16px;background:var(--panel2);display:grid;gap:8px}
.emid .row{gap:10px;min-height:58px}
.eopp{display:grid;gap:6px;padding:4px 10px}
.eo{display:flex;align-items:center;gap:8px;font-weight:700;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 8px}.eo>span:nth-child(2){flex:1}
.eown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 8px 0;justify-items:center}
.ec{display:grid;justify-items:center;gap:4px}.ec .lbl{font-size:13px}
@media (prefers-reduced-motion:reduce){.et.tg{animation:none}}
.eberg{margin:6px 8px;display:grid;gap:6px}
.eheap{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-radius:16px;background:#2f6a7d;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.eb{width:22px;height:27px;border-radius:5px;background:repeating-linear-gradient(135deg,#f7eed6 0 4px,#eadcb8 4px 8px);border:1px solid #8a7350;box-shadow:0 2px 0 #8a7350;padding:0}
.eb[data-a]:active{transform:translateY(1px)}
.eheap{gap:3px;padding:8px;justify-content:center}
.eb{width:15px;height:19px;border-radius:3px;box-shadow:0 1px 0 #8a7350;background:repeating-linear-gradient(135deg,#f7eed6 0 3px,#eadcb8 3px 6px)}
.eown{display:flex;justify-content:center;gap:24px}
.et.empty{font-size:12px}
.wrapseg{flex-wrap:wrap}.wrapseg button{flex:1 0 40px}
/* eentje */
.uc{--w:50px;width:var(--w);height:calc(var(--w)*1.45);flex:none;border-radius:9px;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 2px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0;font-family:"Baloo 2",sans-serif}
.uc .ov{width:76%;height:66%;background:#fff;border-radius:50%;transform:rotate(25deg);display:grid;place-items:center;position:relative}
.uc .ov>*{transform:rotate(-25deg)}
.uc b{font-size:20px;line-height:1;display:grid;place-items:center}
.uc.big{--w:78px}.uc.big b{font-size:32px}
.uc.wild .ov{background:#1d2427}.uc .w4{position:absolute;color:#fff;font-size:15px;text-shadow:0 1px 2px #000}.uc.big .w4{font-size:22px}
.uc.back{background:#1d2427}.uc.back .ov{background:var(--coral)}.uc.back b{color:#fff}
.upile{display:flex;gap:14px;align-items:center;justify-content:center;padding:12px 8px}
.ucol{display:grid;justify-items:center;gap:3px;font-weight:800;font-size:14px}.ucol i{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.uhand{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:10px 8px 4px}
.ucgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ucc{min-height:80px;border-radius:16px;color:#fff;font:800 20px "Baloo 2",sans-serif;text-transform:capitalize;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ueen{border-top:8px solid var(--pc);background:linear-gradient(to bottom,color-mix(in srgb,var(--pc) 22%,transparent),transparent 340px);min-height:100%}
.ueen .pl.on{background:var(--pc);color:var(--pt);border-color:#1d2427;box-shadow:0 0 0 3px var(--pc)}
.ueen .pl.on .st,.ueen .pl.on .vp{color:var(--pt)}
.ueen .pl.on .dot{border-color:var(--pt)}
.ueen .nxt{background:#1d2427}
.ustat{margin:6px 8px;padding:12px 14px;border-radius:14px;background:var(--pc);color:var(--pt);font:800 19px/1.2 "Baloo 2",Nunito,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;border:3px solid #1d2427}
.ustat .dot{border-color:var(--pt)}
.ueen .upile{margin:0 8px;border-radius:18px;border:4px solid var(--pc);background:var(--panel)}
.ueen .uhand{margin:6px 8px;border-radius:18px;background:color-mix(in srgb,var(--pc) 18%,var(--panel));border:3px solid var(--pc)}
.ustat .dot,.ueen .pl.on .dot{display:none}
.slot{display:flex;gap:8px;align-items:center}.slot input{flex:1}
.botname{flex:1;font-weight:800;padding:10px 4px}
.seg.mini{flex:none;gap:4px}.seg.mini button{min-height:40px;padding:0 8px;font-size:13px;flex:none}
.x.sm{min-width:34px;min-height:34px;font-size:16px}

/* ===== Spelkast: vernieuwde speelkamer ===== */
:root{color-scheme:light dark;--bg:light-dark(#f4f5f7,#101c29);--panel:light-dark(#fff,#192a3b);--panel2:light-dark(#f0f3f6,#21364a);--ink:light-dark(#18232f,#f3f6f8);--mute:light-dark(#687687,#a9b8c5);--line:light-dark(#e1e6ec,#30465a);--sea:#173b57;--sea2:#102b42;--shallow:#3b7894;--coral:#ef7655;--coral2:#d75c3e;--sand:#f4e6c4}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{background:var(--bg);font-family:Nunito,system-ui,sans-serif;letter-spacing:.005em}
button,input{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
button:focus-visible,input:focus-visible{outline:3px solid #f29a7f;outline-offset:3px}
.wrap{max-width:1120px;padding-left:22px;padding-right:22px}
.hero{position:relative;padding:24px 0 0;background:radial-gradient(ellipse at 78% 15%,#39718b 0,#214e6a 35%,#142f47 78%);color:#f8fafc;overflow:hidden}
.hero:after{content:"";position:absolute;width:480px;height:480px;border:1px solid #ffffff12;border-radius:50%;right:-170px;top:-250px;box-shadow:0 0 0 42px #ffffff08,0 0 0 90px #ffffff06;pointer-events:none}
.brandline{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:900;letter-spacing:.19em;color:#d2e0e9}
.brandmark{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#f07858;color:white;font-size:18px;box-shadow:0 5px 16px #081b2a55}
.brandpill{margin-left:auto;border:1px solid #ffffff35;border-radius:30px;padding:5px 11px;letter-spacing:.04em;color:#e4edf2}
.herocopy{display:grid;grid-template-columns:1fr minmax(260px,440px);align-items:center;gap:20px;padding:28px 0 8px;position:relative;z-index:1}
.eyebrow{font-size:10px;letter-spacing:.2em;font-weight:900;color:#e98a70}
.hero h1{font-size:clamp(52px,8vw,86px);letter-spacing:-.055em;line-height:.95;margin:10px 0 14px}
.hero h1 span{color:#f07858}
.hero p{font-size:clamp(16px,2vw,20px);color:#d3e0e8;max-width:38ch;line-height:1.55}
.heroart{max-width:440px;justify-self:end;width:100%;filter:drop-shadow(0 18px 20px #061a2b66);transform:rotate(-2deg)}
.heroart svg{margin:0;width:100%;height:auto}
.herofoot{display:flex;gap:22px;flex-wrap:wrap;padding:15px 0 18px;border-top:1px solid #ffffff20;color:#d5e1e8;font-size:12px;font-weight:800;position:relative;z-index:1}
.hubmain{padding-top:34px}
.sectionintro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 18px}
.sectionintro h2{font-size:clamp(26px,4vw,34px);letter-spacing:-.035em;margin-top:5px}
.sectionhint{font-size:12px;font-weight:800;color:var(--mute)}
.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:0 0 54px}
.gcard{position:relative;overflow:hidden;grid-template-columns:104px minmax(0,1fr);gap:16px;min-height:156px;padding:18px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 5px 18px #182b3b0b;text-align:left;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.gcard:after{content:"↗";position:absolute;right:16px;top:14px;color:#9aa8b5;font-size:18px;font-weight:800;opacity:0;transform:translate(-4px,4px);transition:.2s}
.gcard:hover{transform:translateY(-4px);border-color:#c8d5df;box-shadow:0 15px 30px #182b3b16}
.gcard:hover:after{opacity:1;transform:none}
.gcard svg{width:104px;height:104px;filter:drop-shadow(0 5px 5px #102b4218)}
.gcard h2{font-size:24px;letter-spacing:-.025em;padding-right:16px}
.gcard p{font-size:13px;line-height:1.45;margin:6px 0 0;color:var(--mute)}
.gcard .tag{font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-top:12px;color:#d96347}
.gcard.soon{background:transparent;border:1px dashed #c8d0d8;box-shadow:none;min-height:130px;opacity:.75}
.gcard.soon svg{padding:14px}
/* Menu, setup and lobby */
.mhead{background:linear-gradient(115deg,#173b57,#245d78);padding:18px 0 25px;box-shadow:0 8px 25px #102b4214}
.mhead .wrap{max-width:920px}
.mhead h1{font-size:clamp(34px,6vw,48px);letter-spacing:-.035em;margin-top:14px}
.mhead p{font-size:14px;color:#d1e1e9}
.back,.ib{border-radius:13px;background:#ffffff19;border:1px solid #ffffff22;min-height:42px}
.stack{max-width:760px;padding-top:24px;gap:16px}
.card{padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 5px 20px #182b3b08;gap:14px}
.card h3{font-size:23px;letter-spacing:-.025em}
.note{line-height:1.5}
.btn{border-radius:13px;min-height:50px;background:#e96f50;box-shadow:0 3px 0 #c9583c;font-weight:900}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn.alt{background:var(--panel);border:1px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.sea{background:#245d78;box-shadow:0 3px 0 #173b57}
input{border:1px solid var(--line);border-radius:13px;background:var(--panel2)}
.seg button,.tabs button{border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.seg button.on,.tabs button.on{background:#245d78;border-color:#245d78}
.prow{border-radius:12px;background:var(--panel2)}
.code{color:#e96f50;letter-spacing:.16em}
/* Play table */
.g{max-width:1080px;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
.gtop{position:sticky;top:0;z-index:10;padding:10px 14px;background:#142f47;box-shadow:0 5px 20px #071b2b33}
.gtop .ttl{font-size:14px;letter-spacing:.02em}
.ib{min-width:44px}
.pls{gap:9px;padding:12px 12px 6px}
.pl{border:1px solid var(--line);border-radius:14px;padding:9px 10px;background:var(--panel);box-shadow:0 3px 10px #142f4708}
.pl.on{border:2px solid #e96f50;padding:8px 9px;background:color-mix(in srgb,#e96f50 7%,var(--panel));box-shadow:0 0 0 2px #e96f5018}
.pl .nm{font-size:13px}
.status{margin:8px 12px;padding:11px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 3px 12px #142f4708}
.status.me{background:#e96f50;border-color:#e96f50;box-shadow:0 5px 15px #e96f5030}
.bw{margin:4px 12px;border-radius:24px;box-shadow:0 12px 26px #102b4224}
.logl{margin-top:9px}
.hand{gap:7px;padding:12px 12px 6px}
.rc{border-radius:12px;min-height:60px;box-shadow:0 3px 8px #142f4712}
.acts{gap:8px;padding:10px 12px 18px}
.ab{min-height:62px;border-radius:15px;border:1px solid var(--line);background:var(--panel);box-shadow:0 3px 10px #142f4709;font-size:13px}
.ab:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 7px 14px #142f4718}
.ab.pri{background:#e96f50;border-color:#d75c3e;box-shadow:0 3px 0 #c9583c}
.ab.on{background:#245d78;border-color:#245d78}
.offer{border-radius:16px;margin:0 12px 8px}
/* Game-specific play areas */
.felt{margin:8px 12px;padding:14px 12px;border-radius:20px;box-shadow:inset 0 3px 12px #102b4222}

<script>
{
const RES=['wood','brick','sheep','wheat','ore'];
const NAMES={wood:'hout',brick:'leem',sheep:'wol',wheat:'graan',ore:'erts'};
const CAP={wood:'Hout',brick:'Leem',sheep:'Wol',wheat:'Graan',ore:'Erts'};
const COST={road:{wood:1,brick:1},settle:{wood:1,brick:1,sheep:1,wheat:1},city:{wheat:2,ore:3},dev:{sheep:1,wheat:1,ore:1}};
const DEVN={knight:'Ridder',vp:'Overwinningspunt',road:'Stratenbouw',plenty:'Uitvinding',mono:'Monopolie'};
const DEVD={knight:'Verplaats de rover en steel een kaart. Telt mee voor het grootste leger.',vp:'Telt als 1 punt. Blijft geheim tot het einde.',road:'Bouw meteen 2 gratis straten.',plenty:'Pak 2 grondstoffen naar keuze van de bank.',mono:'Kies een grondstof: iedereen geeft jou al die kaarten.'};
const R3=Math.sqrt(3);
const HX=[],V=[],E=[];
(()=>{const vk={},ek={};
for(let q=-2;q<=2;q++)for(let r=Math.max(-2,-q-2);r<=Math.min(2,-q+2);r++)HX.push({q,r,x:R3*(q+r/2),y:1.5*r,v:[]});
HX.forEach((h,hi)=>{
 for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30),x=h.x+Math.cos(a),y=h.y+Math.sin(a);
  const k=Math.round(x*1000)+','+Math.round(y*1000);
  if(vk[k]==null){vk[k]=V.length;V.push({x,y,h:[],adj:[],e:[]})}
  V[vk[k]].h.push(hi);h.v.push(vk[k])}
 for(let i=0;i<6;i++){const a=h.v[i],b=h.v[(i+1)%6],k=Math.min(a,b)+'-'+Math.max(a,b);
  if(ek[k]==null){ek[k]=E.length;E.push({a,b,h:[]});V[a].adj.push(b);V[b].adj.push(a);V[a].e.push(ek[k]);V[b].e.push(ek[k])}
  E[ek[k]].h.push(hi)}});
HX.forEach(h=>{h.n=[];HX.forEach((o,i)=>{const dq=o.q-h.q,dr=o.r-h.r;if(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr)===2)h.n.push(i)})});
})();
const mid=i=>({x:(V[E[i].a].x+V[E[i].b].x)/2,y:(V[E[i].a].y+V[E[i].b].y)/2});
const COAST=E.map((e,i)=>i).filter(i=>E[i].h.length===1).sort((i,j)=>Math.atan2(mid(i).y,mid(i).x)-Math.atan2(mid(j).y,mid(j).x));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const zero=()=>({wood:0,brick:0,sheep:0,wheat:0,ore:0});
const total=r=>RES.reduce((s,k)=>s+((r&&r[k])||0),0);
const has=(r,c)=>RES.every(k=>(r[k]||0)>=(c[k]||0));
const sub=(r,c)=>RES.forEach(k=>r[k]-=(c[k]||0));
const add=(r,c)=>RES.forEach(k=>r[k]+=(c[k]||0));
const fmt=c=>RES.filter(k=>c[k]).map(k=>c[k]+' '+NAMES[k]).join(', ')||'niets';
const clean=r=>{const o=zero();RES.forEach(k=>{o[k]=Math.max(0,Math.min(19,((r&&r[k])|0)))});return o};
function log(S,m){S.log.push(m);if(S.log.length>60)S.log.splice(0,S.log.length-60)}

function makeBoard(){
 const tiles=shuffle([...Array(4).fill('wood'),...Array(3).fill('brick'),...Array(4).fill('sheep'),...Array(4).fill('wheat'),...Array(3).fill('ore'),'desert']);
 const base=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];let nums;
 for(let t=0;t<3000;t++){const n=shuffle(base.slice());nums=tiles.map(r=>r==='desert'?0:n.pop());
  const hot=i=>nums[i]===6||nums[i]===8;
  if(!HX.some((h,i)=>hot(i)&&h.n.some(hot)))break}
 const types=shuffle(['any','any','any','any',...RES]);const st=rnd(30);
 const harbors=[0,3,7,10,13,17,20,23,27].map((o,i)=>({e:COAST[(st+o)%30],t:types[i]}));
 return {tiles,nums,robber:tiles.indexOf('desert'),harbors};
}
function newGame(pl){
 const n=pl.length,ks=[...Array(n).keys()];
 const S={status:'play',v:1,board:makeBoard(),
  players:pl.map(p=>({id:p.id,name:p.name,color:p.color,res:zero(),dev:[],knights:0,left:{road:15,settle:5,city:4}})),
  bld:Array(V.length).fill(null),roads:Array(E.length).fill(null),
  order:[...ks,...ks.slice().reverse()],si:0,need:'settle',last:null,
  phase:'setup',turn:0,turnNo:0,dice:null,
  deck:shuffle([...Array(14).fill('knight'),...Array(5).fill('vp'),'road','road','plenty','plenty','mono','mono']),
  devPlayed:false,discardQ:[],after:'main',rbLeft:0,stealFrom:[],offer:null,
  longest:null,army:null,L:Array(n).fill(0),log:[],winner:null,steal:null};
 S.turn=S.order[0];
 log(S,'Het spel begint! '+S.players[S.turn].name+' plaatst als eerste een dorp.');
 return S;
}
const actor=S=>S.phase==='discard'&&S.discardQ.length?S.discardQ[0].p:S.turn;
function bankLeft(S){const b={wood:19,brick:19,sheep:19,wheat:19,ore:19};S.players.forEach(p=>sub(b,p.res));return b}
function canSettle(S,p,v){
 if(S.bld[v]||S.players[p].left.settle<=0)return false;
 if(V[v].adj.some(a=>S.bld[a]))return false;
 return S.phase==='setup'||V[v].e.some(e=>S.roads[e]===p);
}
const canCity=(S,p,v)=>!!(S.bld[v]&&S.bld[v].p===p&&!S.bld[v].c&&S.players[p].left.city>0);
function canRoad(S,p,e){
 if(S.roads[e]!=null||S.players[p].left.road<=0)return false;
 const ends=[E[e].a,E[e].b];
 if(S.phase==='setup')return ends.includes(S.last);
 return ends.some(v=>{const b=S.bld[v];if(b)return b.p===p;return V[v].e.some(x=>x!==e&&S.roads[x]===p)});
}
function spots(S,p,k){
 if(k==='road')return E.map((e,i)=>i).filter(i=>canRoad(S,p,i));
 if(k==='settle')return V.map((v,i)=>i).filter(i=>canSettle(S,p,i));
 if(k==='city')return V.map((v,i)=>i).filter(i=>canCity(S,p,i));
 return [];
}
function rate(S,p,r){let k=4;S.board.harbors.forEach(h=>{const e=E[h.e];if([e.a,e.b].some(v=>S.bld[v]&&S.bld[v].p===p)){if(h.t==='any')k=Math.min(k,3);else if(h.t===r)k=2}});return k}
function vp(S,p,all){let n=0;S.bld.forEach(b=>{if(b&&b.p===p)n+=b.c?2:1});if(S.longest===p)n+=2;if(S.army===p)n+=2;if(all)n+=S.players[p].dev.filter(d=>d.t==='vp').length;return n}
function roadLen(S,p){
 let best=0;const blocked=v=>S.bld[v]&&S.bld[v].p!==p;const used=new Set();
 const dfs=(v,len)=>{if(len>best)best=len;if(len>0&&blocked(v))return;
  for(const ei of V[v].e){if(S.roads[ei]!==p||used.has(ei))continue;used.add(ei);dfs(E[ei].a===v?E[ei].b:E[ei].a,len+1);used.delete(ei)}};
 for(let v=0;v<V.length;v++)if(V[v].e.some(e=>S.roads[e]===p))dfs(v,0);
 return best;
}
function upLongest(S){
 const L=S.players.map((_,i)=>roadLen(S,i));S.L=L;const max=Math.max(...L),h=S.longest,old=h;
 if(h!=null&&L[h]>=5&&L[h]===max)return;
 const top=L.map((l,i)=>l===max?i:-1).filter(i=>i>=0);
 S.longest=(max>=5&&top.length===1)?top[0]:null;
 if(S.longest!==old&&S.longest!=null)log(S,S.players[S.longest].name+' heeft nu de langste handelsroute ('+max+').');
}
function upArmy(S){S.players.forEach((p,i)=>{if(p.knights>=3&&(S.army==null||(S.army!==i&&p.knights>S.players[S.army].knights))){S.army=i;log(S,p.name+' heeft nu het grootste leger.')}})}
function win(S){if(S.phase==='setup'||S.status!=='play')return;const p=S.turn,n=vp(S,p,true);if(n>=10){S.status='over';S.phase='over';S.winner=p;log(S,S.players[p].name+' wint met '+n+' punten!')}}
function produce(S,roll){
 const gain=S.players.map(()=>zero());
 HX.forEach((h,i)=>{if(S.board.nums[i]!==roll||S.board.robber===i)return;const r=S.board.tiles[i];h.v.forEach(v=>{const b=S.bld[v];if(b)gain[b.p][r]+=b.c?2:1})});
 const bk=bankLeft(S);
 RES.forEach(r=>{const need=gain.reduce((s,g)=>s+g[r],0),who=gain.filter(g=>g[r]>0).length;
  if(need>bk[r]){if(who>1){gain.forEach(g=>g[r]=0);log(S,'De bank heeft te weinig '+NAMES[r]+': niemand krijgt het.')}else gain.forEach(g=>{if(g[r])g[r]=bk[r]})}});
 let any=false;gain.forEach((g,i)=>{if(total(g)){any=true;add(S.players[i].res,g);log(S,S.players[i].name+' krijgt '+fmt(g)+'.')}});
 if(!any)log(S,'Niemand krijgt iets.');
}
function steal(S,me,q){
 const Q=S.players[q],pool=[];RES.forEach(k=>{for(let i=0;i<Q.res[k];i++)pool.push(k)});
 if(!pool.length)return;const r=pool[rnd(pool.length)];Q.res[r]--;S.players[me].res[r]++;
 S.steal={from:q,to:me,r,turnNo:S.turnNo};log(S,S.players[me].name+' steelt een kaart van '+Q.name+'.');
}
function act(S,me,a){
 if(!a||typeof a!=='object')return 'Onbekende actie.';
 if(S.status!=='play')return 'Het spel is afgelopen.';
 const P=S.players[me];if(!P)return 'Je speelt niet mee.';
 const mine=me===actor(S);
 const notNow='Dat kan nu niet.';
 switch(a.t){
 case 'place':{
  if(!mine)return 'Het is niet jouw beurt.';const i=a.i|0;
  if(S.phase==='setup'){
   if(a.kind!==S.need)return 'Plaats eerst een '+(S.need==='settle'?'dorp':'straat')+'.';
   if(a.kind==='settle'){if(!V[i]||!canSettle(S,me,i))return 'Hier mag geen dorp (te dicht bij een ander).';
    S.bld[i]={p:me,c:0};P.left.settle--;S.last=i;S.need='road';log(S,P.name+' plaatst een dorp.');
    if(S.si>=S.players.length){const g=zero();V[i].h.forEach(h=>{const r=S.board.tiles[h];if(r!=='desert')g[r]++});add(P.res,g);log(S,P.name+' krijgt '+fmt(g)+'.')}
    return null}
   if(!E[i]||!canRoad(S,me,i))return 'De straat moet aan je nieuwe dorp liggen.';
   S.roads[i]=me;P.left.road--;S.si++;S.need='settle';S.last=null;upLongest(S);
   if(S.si>=S.order.length){S.phase='roll';S.turn=0;S.turnNo=1;log(S,'De opbouw is klaar. '+S.players[0].name+' begint.')}
   else S.turn=S.order[S.si];
   return null}
  if(S.phase==='roadbuild'){
   if(a.kind!=='road'||!E[i]||!canRoad(S,me,i))return 'Hier kun je geen straat bouwen.';
   S.roads[i]=me;P.left.road--;S.rbLeft--;log(S,P.name+' bouwt een gratis straat.');upLongest(S);
   if(S.rbLeft<=0||!spots(S,me,'road').length){S.phase='main';S.rbLeft=0}
   win(S);return null}
  if(S.phase!=='main')return notNow;
  const c=COST[a.kind];if(!c||a.kind==='dev')return notNow;
  if(!has(P.res,c))return 'Je hebt niet genoeg grondstoffen.';
  if(a.kind==='road'){if(!E[i]||!canRoad(S,me,i))return 'Hier kun je geen straat bouwen.';S.roads[i]=me;P.left.road--}
  else if(a.kind==='settle'){if(!V[i]||!canSettle(S,me,i))return 'Hier mag geen dorp.';S.bld[i]={p:me,c:0};P.left.settle--}
  else{if(!V[i]||!canCity(S,me,i))return 'Kies een eigen dorp.';S.bld[i]={p:me,c:1};P.left.city--;P.left.settle++}
  sub(P.res,c);log(S,P.name+' bouwt '+{road:'een straat',settle:'een dorp',city:'een stad'}[a.kind]+'.');
  upLongest(S);win(S);return null}
 case 'roll':{
  if(!mine||S.phase!=='roll')return 'Je kunt nu niet gooien.';
  const d=[1+rnd(6),1+rnd(6)],s=d[0]+d[1];S.dice=d;log(S,P.name+' gooit '+s+'.');
  if(s===7){S.after='main';S.discardQ=S.players.map((p,i)=>({p:i,n:Math.floor(total(p.res)/2)})).filter(x=>total(S.players[x.p].res)>7);
   if(S.discardQ.length){S.phase='discard';log(S,'Wie meer dan 7 kaarten heeft, legt de helft af.')}else S.phase='robber'}
  else{produce(S,s);S.phase='main'}
  return null}
 case 'discard':{
  if(S.phase!=='discard'||S.discardQ[0].p!==me)return 'Je hoeft nu niets af te leggen.';
  const n=S.discardQ[0].n,r=clean(a.res);if(total(r)!==n||!has(P.res,r))return 'Kies precies '+n+' kaarten.';
  sub(P.res,r);log(S,P.name+' legt '+n+' kaarten af.');S.discardQ.shift();if(!S.discardQ.length)S.phase='robber';return null}
 case 'robber':{
  if(!mine||S.phase!=='robber')return notNow;const h=a.i|0;
  if(!HX[h]||h===S.board.robber)return 'Kies een ander vak voor de rover.';
  S.board.robber=h;log(S,P.name+' verplaatst de rover.');
  const vic=[...new Set(HX[h].v.map(v=>S.bld[v]).filter(b=>b&&b.p!==me&&total(S.players[b.p].res)>0).map(b=>b.p))];
  if(!vic.length)S.phase=S.after;else if(vic.length===1){steal(S,me,vic[0]);S.phase=S.after}else{S.phase='steal';S.stealFrom=vic}
  return null}
 case 'steal':{

  steal(S,me,a.p);S.stealFrom=[];S.phase=S.after;return null}
 case 'buy':{
  if(!mine||S.phase!=='main')return notNow;if(!S.deck.length)return 'De stapel ontwikkelingskaarten is op.';
  if(!has(P.res,COST.dev))return 'Je hebt niet genoeg grondstoffen.';
  sub(P.res,COST.dev);P.dev.push({t:S.deck.pop(),n:S.turnNo});log(S,P.name+' koopt een ontwikkelingskaart.');win(S);return null}
 case 'play':{
  if(!mine)return 'Het is niet jouw beurt.';if(S.devPlayed)return 'Je hebt deze beurt al een kaart gespeeld.';
  if(!(S.phase==='main'||(S.phase==='roll'&&a.c==='knight')))return notNow;
  const idx=P.dev.findIndex(d=>d.t===a.c&&d.n<S.turnNo);if(idx<0||a.c==='vp')return 'Deze kaart kun je nu niet spelen.';
  if(a.c==='plenty'){if(![a.a,a.b].every(r=>RES.includes(r)))return 'Kies twee grondstoffen.';const need=zero();need[a.a]++;need[a.b]++;

  if(a.c==='mono'){if(!RES.includes(a.r))return 'Kies een grondstof.';let n=0;S.players.forEach((q,i)=>{if(i!==me){n+=q.res[a.r];q.res[a.r]=0}});P.res[a.r]+=n;log(S,P.name+' speelt Monopolie en krijgt '+n+' '+NAMES[a.r]+'.')}
  P.dev.splice(idx,1);S.devPlayed=true;
  if(a.c==='knight'){P.knights++;log(S,P.name+' speelt een Ridder.');upArmy(S);S.after=S.phase;S.phase='robber'}

  if(!mine||S.phase!=='main')return notNow;if(!RES.includes(a.g)||!RES.includes(a.w)||a.g===a.w)return 'Kies twee verschillende grondstoffen.';
  const k=rate(S,me,a.g);if(P.res[a.g]<k)return 'Je hebt '+k+' '+NAMES[a.g]+' nodig.';if(bankLeft(S)[a.w]<1)return 'De bank heeft geen '+NAMES[a.w]+' meer.';
  P.res[a.g]-=k;P.res[a.w]++;log(S,P.name+' ruilt '+k+' '+NAMES[a.g]+' voor 1 '+NAMES[a.w]+'.');return null}
 case 'offer':{
  if(!mine||S.phase!=='main')return notNow;const g=clean(a.give),w=clean(a.get);
  if(!total(g)||!total(w))return 'Kies wat je geeft én wat je wilt.';if(!has(P.res,g))return 'Zoveel heb je niet.';

 case 'decline':{if(!S.offer||S.offer.from===me)return notNow;if(!S.offer.no.includes(me))S.offer.no.push(me);return null}

 }

<script>
{
const {shuffle,log,range,uniq}=globalThis.LIB;
// tegels: 0..103 = getal 1-13 in 4 kleuren (2x), 104/105 = joker
const tile=id=>id>=104?{j:1}:{n:id%13+1,c:Math.floor(id/13)%4};
const tval=id=>id>=104?30:tile(id).n;
function setInfo(ids){
 if(!ids||ids.length<3)return {ok:false};
 const t=ids.map(tile),nat=t.filter(x=>!x.j);
 if(!nat.length)return {ok:false};
 if(t.length<=4&&nat.every(x=>x.n===nat[0].n)&&new Set(nat.map(x=>x.c)).size===nat.length)
  return {ok:true,kind:'group',value:nat[0].n*t.length};
 if(t.length<=13&&nat.every(x=>x.c===nat[0].c)){
  const ns=nat.map(x=>x.n).sort((a,b)=>a-b);
  if(uniq(ns)){const span=ns[ns.length-1]-ns[0]+1;
   if(span<=t.length){let lo=ns[0],hi=ns[ns.length-1];const extra=t.length-span,up=Math.min(extra,13-hi);hi+=up;lo-=extra-up;
    if(lo>=1){let v=0;for(let k=lo;k<=hi;k++)v+=k;return {ok:true,kind:'run',value:v,lo,hi}}}}}
 return {ok:false};
}
// volgorde voor weergave
function arrange(ids){
 const inf=setInfo(ids);if(!inf.ok)return ids.slice();
 const jk=ids.filter(i=>i>=104),nat=ids.filter(i=>i<104);
 if(inf.kind==='group')return [...nat.sort((a,b)=>tile(a).c-tile(b).c),...jk];
 const out=[],byN={};nat.forEach(i=>byN[tile(i).n]=i);const J=jk.slice();
 for(let k=inf.lo;k<=inf.hi;k++)out.push(byN[k]!=null?byN[k]:J.pop());
 return out;
}
const key=s=>s.slice().sort((a,b)=>a-b).join(',');
function newGame(pl){
 const pool=shuffle(range(106));
 const S={status:'play',v:1,players:pl.map(p=>({id:p.id,name:p.name,color:p.color,rack:pool.splice(0,14),opened:false})),
  pool,table:[],turn:0,turnNo:1,passes:0,log:[],winner:null};
 log(S,'Iedereen krijgt 14 stenen. '+S.players[0].name+' begint.');return S;
}
const actor=S=>S.turn;
function next(S){S.turn=(S.turn+1)%S.players.length;S.turnNo++}
function finish(S,w){
 S.status='over';S.winner=w;
 S.players.forEach(p=>p.pen=p.rack.reduce((s,i)=>s+tval(i),0));
 log(S,S.players[w].name+' wint!');
}
function act(S,me,a){
 if(S.status!=='play')return 'Het spel is afgelopen.';
 const P=S.players[me];if(!P)return 'Je speelt niet mee.';
 if(me!==S.turn)return 'Het is niet jouw beurt.';
 if(a.t==='draw'){
  if(!S.pool.length){S.passes++;log(S,P.name+' past (de pot is leeg).');
   if(S.passes>=S.players.length){let w=0;S.players.forEach((p,i)=>{if(p.rack.reduce((s,x)=>s+tval(x),0)<S.players[w].rack.reduce((s,x)=>s+tval(x),0))w=i});finish(S,w);return null}
   next(S);return null}
  P.rack.push(S.pool.pop());S.passes=0;log(S,P.name+' pakt een steen.');next(S);return null}
 if(a.t==='play'){
  const nt=Array.isArray(a.table)?a.table.filter(s=>Array.isArray(s)&&s.length).map(s=>s.map(x=>x|0)):null;
  if(!nt)return 'Ongeldige zet.';
  const flat=nt.flat();if(!uniq(flat))return 'Ongeldige zet.';
  const old=S.table.flat();
  if(!old.every(i=>flat.includes(i)))return 'Stenen van tafel mogen niet terug naar je rek.';
  const nw=flat.filter(i=>!old.includes(i));
  if(!nw.length)return 'Leg minstens één steen uit je rek.';
  if(!nw.every(i=>P.rack.includes(i)))return 'Ongeldige zet.';
  const bad=nt.findIndex(s=>!setInfo(s).ok);if(bad>=0)return 'Niet elke rij is geldig (minstens 3 stenen, serie of groep).';
  if(!P.opened){
   const left=S.table.map(key),rest=[];
   nt.forEach(s=>{const k=key(s),j=left.indexOf(k);if(j>=0)left.splice(j,1);else rest.push(s)});
   if(left.length)return 'Je mag pas met de tafel schuiven als je bent uitgekomen.';
   if(!rest.every(s=>s.every(i=>nw.includes(i))))return 'Je eerste keer leg je alleen eigen stenen.';
   const val=rest.reduce((s,x)=>s+setInfo(x).value,0);
   if(val<30)return 'Om uit te komen heb je minstens 30 punten nodig (nu '+val+').';
   P.opened=true;log(S,P.name+' komt uit met '+val+' punten.');
  }
  S.table=nt.map(arrange);P.rack=P.rack.filter(i=>!nw.includes(i));S.passes=0;
  log(S,P.name+' legt '+nw.length+' steen'+(nw.length>1?'en':'')+'.');
  if(!P.rack.length){finish(S,me);return null}
  next(S);return null}
 return 'Onbekende actie.';
}
function results(S){return S.players.map((p,i)=>({p:i,n:p.rack.reduce((s,x)=>s+tval(x),0)})).sort((a,b)=>a.n-b.n).map(r=>({p:r.p,txt:r.n?r.n+' strafpunten':'uit!'}))}
globalThis.ENG.rummy={newGame,act,actor,results,tile,setInfo,arrange,tval};
}

<script>
{
const {shuffle,log,range}=globalThis.LIB;
// tegels: 1..20 (8x), 0 = ezel
const EZ=0;
function newGame(pl,o){
 const sets=Math.max(1,Math.min(8,(o&&o.sets|0)||8));
 const all=shuffle([...range(sets).flatMap(()=>range(20).map(i=>i+1)),EZ]);
 const S={status:'play',v:1,players:pl.map(p=>({id:p.id,name:p.name,color:p.color,closed:[],open:[]})),
  mid:[],pool:all,phase:'berg',hand:null,turn:0,turnNo:1,log:[],winner:null};
 S.sets=sets;log(S,'Gespeeld met '+sets+' stapels van 1 t/m 20. '+S.players[0].name+' begint. Pak een tegel uit de berg.');return S;
}
const actor=S=>S.turn;
const top=a=>a.length?a[a.length-1]:null;
// mag tegel t op stapel (bovenste waarde b)?
const onMid=(t,pile)=>t===EZ?top(pile)===20:top(pile)!==EZ&&top(pile)!==20&&t===top(pile)+1;
const onPlayer=(t,pile)=>{const b=top(pile);if(b==null||t==null)return false;if(t===EZ)return b===20;if(b===EZ)return t===20;return Math.abs(t-b)===1};
const midOk=(S,t)=>t!=null&&(t===1||S.mid.some(p=>onMid(t,p)));
const anyMove=(S,me,t)=>t!=null&&(midOk(S,t)||S.players.some((q,i)=>i!==me&&onPlayer(t,q.open)));
function canAny(S,me){const P=S.players[me];return anyMove(S,me,S.hand)||anyMove(S,me,top(P.open))}
function penalty(S,me,why){
 const P=S.players[me];let n=0;
 S.players.forEach((q,i)=>{if(i===me)return;const t=q.open.length?q.open.pop():q.closed.length?q.closed.pop():null;if(t!=null){P.open.push(t);n++}});
 log(S,P.name+' '+why+' en krijgt '+n+' strafkaart'+(n===1?'':'en')+'.');
 S.players.forEach((q,i)=>{if(i!==me&&S.status==='play')checkWinAny(S,i)});
}
function checkWinAny(S,i){const Q=S.players[i];if(S.phase==='own'&&!Q.closed.length&&!(S.turn===i&&S.hand!=null)){S.status='over';S.winner=i;log(S,Q.name+' heeft zijn stapel leeg en wint!')}}
function srcTile(S,me,src){const P=S.players[me];if(src==='open')return top(P.open);return S.hand}
function take(S,me,src){const P=S.players[me];if(src==='open')return P.open.pop();const t=S.hand;S.hand=null;return t}
function endTurn(S){
 S.mid=S.mid.filter(p=>top(p)!==20&&top(p)!==EZ);
 S.turn=(S.turn+1)%S.players.length;S.turnNo++;S.hand=null;
}
function toOwn(S){
 if(S.phase!=='berg'||S.pool.length||S.hand!=null)return;
 S.phase='own';S.players.forEach(p=>{p.closed=p.open.slice().reverse();p.open=[]});
 log(S,'De berg is op! Iedereen draait zijn open stapel om. Vanaf nu speel je van je eigen stapel.');
 const n=S.players.length;for(let k=0;k<n;k++){const i=(S.turn+k)%n;if(!S.players[i].closed.length){S.status='over';S.winner=i;log(S,S.players[i].name+' heeft geen tegels meer en wint!');return}}
}
function checkWin(S,me){if(S.phase!=='own')return false;const P=S.players[me];if(!P.closed.length&&S.hand==null){S.status='over';S.winner=me;log(S,P.name+' heeft zijn stapel leeg en wint!');return true}return false}
const nm=t=>t===EZ?'de ezel':'een '+t;
function act(S,me,a){
 if(S.status!=='play')return 'Het spel is afgelopen.';
 const P=S.players[me];if(!P)return 'Je speelt niet mee.';if(me!==S.turn)return 'Het is niet jouw beurt.';
 switch(a.t){
 case 'flip':
  if(S.hand!=null)return 'Leg eerst je omgedraaide tegel neer.';if(!P.closed.length)return 'Je stapel is leeg.';
  if(S.phase!=='own')return 'Pak een tegel uit de berg.';if(canAny(S,me))penalty(S,me,'vergat een zet');if(S.status!=='play')return null;S.hand=P.closed.pop();return null;
 case 'pick':{
  if(S.phase!=='berg')return 'De berg is op.';if(S.hand!=null)return 'Leg eerst je tegel neer.';const i=a.i|0;if(S.pool[i]==null)return 'Kies een tegel.';
  if(canAny(S,me))penalty(S,me,'vergat een zet');if(S.status!=='play')return null;S.hand=S.pool.splice(i,1)[0];return null}
 case 'play':{
  const src=a.src==='open'?'open':'hand',t=srcTile(S,me,src);if(t==null)return src==='open'?'Je open stapel is leeg.':'Draai eerst een tegel om.';
  if(a.dst==='new'){if(t!==1)return 'Dat past daar niet.';take(S,me,src);S.mid.push([1]);log(S,P.name+' begint een nieuwe stapel.')}
  else if(a.dst==='mid'){const pile=S.mid[a.i|0];if(!pile)return 'Kies een stapel.';if(!onMid(t,pile))return 'Dat past daar niet.';take(S,me,src);pile.push(t);log(S,P.name+' legt '+nm(t)+' in het midden.')}
  else if(a.dst==='p'){const q=a.i|0,Q=S.players[q];if(!Q||q===me)return 'Kies een medespeler.';if(!onPlayer(t,Q.open))return 'Dat past daar niet.';const skipMid=midOk(S,t);take(S,me,src);Q.open.push(t);log(S,P.name+' legt '+nm(t)+' op de stapel van '+Q.name+'.');if(skipMid)penalty(S,me,'gaf het midden geen voorrang')}
  else return 'Kies een plek.';
  if(!checkWin(S,me))toOwn(S);return null}
 case 'dump':{
  if(S.hand==null)return 'Draai eerst een tegel om.';const t=S.hand;
    const forgot=canAny(S,me);P.open.push(t);S.hand=null;log(S,P.name+' legt '+nm(t)+' op zijn eigen stapel.');if(forgot)penalty(S,me,'vergat een zet');if(S.status==='play'&&!checkWin(S,me)){endTurn(S);toOwn(S)}return null}
 }
 return 'Onbekende actie.';
}
function results(S){return S.players.map((p,i)=>({p:i,n:p.closed.length+p.open.length})).sort((a,b)=>a.n-b.n).map(r=>({p:r.p,txt:r.n?r.n+' tegels over':'alles kwijt!'}))}
globalThis.ENG.ezel={newGame,act,actor,results,onMid,onPlayer,top,EZ,canAny,midOk};
}

<script>
{
const {shuffle,log,range}=globalThis.LIB;
// kaarten: per kleur 0 (1x), 1-9 (2x), overslaan, omkeren, +2 (2x) = 25; dan 4 keuzekaarten en 4 keuze +4
const CARDS=[];
for(let c=0;c<4;c++){CARDS.push({c,v:0});for(let r=0;r<2;r++){for(let n=1;n<=9;n++)CARDS.push({c,v:n});['skip','rev','d2'].forEach(v=>CARDS.push({c,v}))}}
for(let i=0;i<4;i++)CARDS.push({c:-1,v:'w'});for(let i=0;i<4;i++)CARDS.push({c:-1,v:'w4'});
const card=id=>CARDS[id];
const CN=['rood','blauw','groen','geel'];
const VN={skip:'Overslaan',rev:'Omkeren',d2:'+2',w:'Kleurkeuze',w4:'+4'};
const pts=id=>{const k=card(id);return typeof k.v==='number'?k.v:k.c<0?50:20};
const nmc=id=>{const k=card(id);return k.c<0?VN[k.v]:CN[k.c]+' '+(typeof k.v==='number'?k.v:VN[k.v])};
function newGame(pl){
 const deck=shuffle(range(CARDS.length));
 const S={status:'play',v:1,players:pl.map(p=>({id:p.id,name:p.name,color:p.color,hand:deck.splice(0,7)})),
  deck,discard:[],color:0,turn:0,dir:1,step:'play',drawn:null,turnNo:1,log:[],winner:null};
 let k=S.deck.findIndex(id=>typeof card(id).v==='number');const first=S.deck.splice(k,1)[0];
 S.discard.push(first);S.color=card(first).c;
 log(S,'De eerste kaart is '+nmc(first)+'. '+S.players[0].name+' begint.');return S;
}
const actor=S=>S.turn;
const nxt=(S,k=1)=>{const n=S.players.length;return ((S.turn+S.dir*k)%n+n)%n};
function draw(S){if(!S.deck.length){const top=S.discard.pop();S.deck=shuffle(S.discard);S.discard=[top]}return S.deck.pop()}
function give(S,p,n){const P=S.players[p];for(let i=0;i<n;i++){const c=draw(S);if(c==null)break;P.hand.push(c)}}
function advance(S,k){S.turn=nxt(S,k);S.step='play';S.drawn=null;S.turnNo++}
const fits=(S,id)=>{const k=card(id),t=card(S.discard[S.discard.length-1]);return k.c<0||k.c===S.color||k.v===t.v};
function act(S,me,a){
 if(S.status!=='play')return 'Het spel is afgelopen.';
 const P=S.players[me];if(!P)return 'Je speelt niet mee.';if(me!==S.turn)return 'Het is niet jouw beurt.';
 switch(a.t){
 case 'draw':{if(S.step!=='play')return 'Je hebt al een kaart gepakt.';const c=draw(S);if(c==null){log(S,'Er zijn geen kaarten meer. '+P.name+' past.');advance(S,1);return null}P.hand.push(c);S.step='drawn';S.drawn=c;log(S,P.name+' pakt een kaart.');return null}
 case 'pass':{if(S.step!=='drawn')return 'Pak eerst een kaart.';log(S,P.name+' past.');advance(S,1);return null}
 case 'play':{
  const id=a.id|0;if(!P.hand.includes(id))return 'Kies een kaart.';
  if(S.step==='drawn'&&id!==S.drawn)return 'Je mag alleen de gepakte kaart nog spelen.';
  if(!fits(S,id))return 'Die kaart past niet.';
  const k=card(id);let col=k.c;if(k.c<0){col=a.color|0;if(col<0||col>3)return 'Kies een kleur.'}
  P.hand.splice(P.hand.indexOf(id),1);S.discard.push(id);S.color=col;
  log(S,P.name+' speelt '+nmc(id)+(k.c<0?' en kiest '+CN[col]:'')+'.');
  if(!P.hand.length){S.status='over';S.winner=me;S.players.forEach(p=>p.pts=p.hand.reduce((s,x)=>s+pts(x),0));log(S,P.name+' is alle kaarten kwijt en wint!');return null}
  if(P.hand.length===1&&!a.uno){give(S,me,2);log(S,P.name+' vergat "Eentje!" te roepen en pakt 2 strafkaarten.')}
  else if(P.hand.length===1)log(S,P.name+' roept: Eentje!');
  const n=S.players.length;
  if(k.v==='skip'){log(S,S.players[nxt(S)].name+' wordt overgeslagen.');advance(S,2)}
  else if(k.v==='rev'){if(n===2){advance(S,2)}else{S.dir*=-1;advance(S,1)}}
  else if(k.v==='d2'){const q=nxt(S);give(S,q,2);log(S,S.players[q].name+' pakt 2 kaarten en slaat over.');advance(S,2)}
  else if(k.v==='w4'){const q=nxt(S);give(S,q,4);log(S,S.players[q].name+' pakt 4 kaarten en slaat over.');advance(S,2)}
  else advance(S,1);
  return null}
 }

<script>
{
// Computerspelers: per spel een functie (S, i) -> lijst kandidaat-acties, beste eerst.
// De speler probeert ze op volgorde; de eerste die de spelregels accepteren, wordt gespeeld.
const ENG=globalThis.ENG,BOTS={};
const pickR=a=>a[Math.floor(Math.random()*a.length)];

/* ---------------- Eilanders ---------------- */
{
const EN=globalThis.EN,{RES,HX,V,E,COST}=EN;
const pip=n=>n?6-Math.abs(7-n):0;
const vScore=(S,v)=>{let s=0;const seen=new Set();V[v].h.forEach(h=>{const r=S.board.tiles[h];if(r==='desert'||h===S.board.robber&&false)return;s+=pip(S.board.nums[h]);seen.add(r)});return s+seen.size*0.6};
const best=(S,list,f)=>list.slice().sort((a,b)=>f(b)-f(a));
function goal(S,i){const P=S.players[i];if(EN.spots(S,i,'city').length)return COST.city;if(EN.spots(S,i,'settle').length)return COST.settle;return P.left.settle>0?COST.road:COST.dev}
function roadPick(S,i){
 const list=EN.spots(S,i,'road');
 return best(S,list,e=>{const ends=[E[e].a,E[e].b];return Math.max(...ends.map(v=>(!S.bld[v]&&V[v].adj.every(a=>!S.bld[a]))?vScore(S,v):0))+Math.random()*.5});

BOTS.eilanders=(S,i)=>{
 const P=S.players[i],A=EN.actor(S),out=[];
 if(A!==i){
  const o=S.offer;if(o&&o.from!==i&&!o.no.includes(i)){const g=goal(S,i);const helps=RES.some(r=>o.give[r]&&P.res[r]<(g[r]||0));const spare=RES.every(r=>!o.get[r]||P.res[r]-o.get[r]>=(g[r]||0));out.push(helps&&spare&&EN.has(P.res,o.get)?{t:'accept'}:{t:'decline'},{t:'decline'})}
  return out}
 switch(S.phase){
 case 'setup':{if(S.need==='settle')return best(S,EN.spots(S,i,'settle'),v=>vScore(S,v)+Math.random()*.3).slice(0,5).map(v=>({t:'place',kind:'settle',i:v}));
  return roadPick(S,i).map(e=>({t:'place',kind:'road',i:e}))}
 case 'roll':{const onMe=HX[S.board.robber].v.some(v=>S.bld[v]&&S.bld[v].p===i);if(onMe)out.push({t:'play',c:'knight'});out.push({t:'roll'});return out}
 case 'discard':{const n=S.discardQ[0].n,r=EN.zero(),h={...P.res};for(let k=0;k<n;k++){const m=RES.slice().sort((a,b)=>h[b]-h[a])[0];h[m]--;r[m]++}return [{t:'discard',res:r}]}
 case 'robber':{const opp=h=>{let s=0,mine=false;HX[h].v.forEach(v=>{const b=S.bld[v];if(b){if(b.p===i)mine=true;else s+=(b.c?2:1)*pip(S.board.nums[h])*(1+EN.vp(S,b.p,false)/5)}});return mine?-1:s};
  return best(S,HX.map((h,k)=>k).filter(k=>k!==S.board.robber),opp).slice(0,3).map(h=>({t:'robber',i:h}))}
 case 'steal':return S.stealFrom.slice().sort((a,b)=>EN.total(S.players[b].res)-EN.total(S.players[a].res)).map(p=>({t:'steal',p}));

 case 'main':{
  if(S.offer&&S.offer.from===i)return [{t:'cancel'}];
  const can=k=>EN.has(P.res,COST[k]);
  if(can('city'))EN.spots(S,i,'city').sort((a,b)=>vScore(S,b)-vScore(S,a)).forEach(v=>out.push({t:'place',kind:'city',i:v}));
  if(can('settle'))best(S,EN.spots(S,i,'settle'),v=>vScore(S,v)).forEach(v=>out.push({t:'place',kind:'settle',i:v}));

/* ---------------- Tegelrummy ---------------- */
{
const G=ENG.rummy;
function findSets(rack){
 const out=[];const r=rack.slice();
 // groepen
 const byN={};r.filter(i=>i<104).forEach(i=>{const t=G.tile(i);(byN[t.n]=byN[t.n]||{})[t.c]=i});

 // series per kleur, langste stukken van 3+

  let run=[];for(let n=1;n<=14;n++){if(have[n]!=null)run.push(have[n]);else{if(run.length>=3)out.push(run);run=[]}}}

 if(jk.length){const nat=rack.filter(x=>x<104);outer:for(let a=0;a<nat.length;a++)for(let b=a+1;b<nat.length;b++){const s=[nat[a],nat[b],jk[0]];if(G.setInfo(s).ok){newSets.push(s);rack=rack.filter(x=>!s.includes(x));break outer}}}

 if(P.opened||newSets.reduce((s,x)=>s+G.setInfo(x).value,0)>=30){
  let all=[...table,...newSets];
  if(P.opened){let moved=true;while(moved){moved=false;for(const t of rack.slice()){for(const s of all){const n=[...s,t];if(G.setInfo(n).ok){s.push(t);rack=rack.filter(x=>x!==t);moved=true;break}}}}}
  else{let moved=true;while(moved){moved=false;for(const t of rack.slice()){for(const s of newSets){const n=[...s,t];if(G.setInfo(n).ok){s.push(t);rack=rack.filter(x=>x!==t);moved=true;break}}}}all=[...table,...newSets]}
  if(rack.length<P.rack.length)return all;
 }

}
BOTS.rummy=(S,i)=>{if(S.turn!==i)return [];const p=plan(S,i);const out=[];if(p)out.push({t:'play',table:p});out.push({t:'draw'});return out};

{

/* ---------------- Eentje! ---------------- */
{

function mfPlay(mode){app.classList.add('wide');
 var solo=mode==='solo',si=data.mfSolo==null?1:data.mfSolo,SL=[[9,9,10],[16,16,40],[16,16,60]][si],
  W=solo?SL[0]:16,H=solo?SL[1]:16,M=solo?SL[2]:51,WIN=26,N=W*H,lv=data.mfLv==null?1:data.mfLv,
  mine=[],num=[],op=[],own=[],fl=[],i,turn=1,sc={1:0,2:0},bomb={1:true,2:true},bm=false,bt=-1,last=-1,
  over=false,res=0,quit=false,busy=false,first=true,t0=0,tm=null,fm=false,boom=-1,rz=false,hideEnd=false,msg='',lp=null,lpDone=false;
 for(i=0;i<N;i++){mine.push(false);num.push(0);op.push(0);own.push(0);fl.push(0)}

 function flood(k){var st=[k],q;while(st.length){q=st.pop();if(op[q]||own[q]||fl[q]||mine[q])continue;op[q]=1;if(num[q]===0)nb(q).forEach(function(j){if(!op[j])st.push(j)})}}

 function endCheck(){if(sc[1]>=WIN||sc[2]>=WIN){over=true;res=sc[1]>=WIN?1:2;bm=false;bt=-1;if(isHuman(res))confetti(1);sfx('win')}}
 function move(k,p){if(op[k]||own[k])return false;last=k;
  if(mine[k]){op[k]=1;own[k]=p;sc[p]++;sfx('ok');endCheck();return true}
  flood(k);turn=other(p);return false}
 function doBomb(k,p){var r=k/W|0,c=k%W,y,x,q,got=0;bomb[p]=false;bm=false;bt=-1;
  for(y=r-2;y<=r+2;y++)for(x=c-2;x<=c+2;x++)if(y>=0&&y<H&&x>=0&&x<W){q=y*W+x;if(op[q]||own[q])continue;if(mine[q]){op[q]=1;own[q]=p;sc[p]++;got++}else flood(q)}
  last=k;sfx(got?'win':'ok');msg='💥 '+name(p)+(p===1&&mode==='cpu'?' gooide':' gooide')+' de bom en vond '+got+(got===1?' mijn.':' mijnen.');endCheck();if(!over)turn=other(p)}

 /* ---- computer ---- */
 function analyze(deep){var S={},Mi={},cons=[],k,ch=true,loops=0;
  for(k=0;k<N;k++)if(op[k]&&!own[k]&&num[k]>0){var u=[],kn=0;nb(k).forEach(function(j){if(own[j])kn++;else if(!op[j])u.push(j)});if(u.length)cons.push({c:u,n:num[k]-kn})}
  while(ch&&loops++<40){ch=false;
   cons.forEach(function(o){var c2=[],n2=o.n;o.c.forEach(function(j){if(Mi[j])n2--;else if(!S[j])c2.push(j)});o.c=c2;o.n=n2});
   cons=cons.filter(function(o){return o.c.length});
   cons.forEach(function(o){if(o.n===o.c.length)o.c.forEach(function(j){if(!Mi[j]){Mi[j]=1;ch=true}});else if(o.n===0)o.c.forEach(function(j){if(!S[j]){S[j]=1;ch=true}})});
   if(!ch&&deep){for(var a=0;a<cons.length&&!ch;a++)for(var b=0;b<cons.length&&!ch;b++){var A=cons[a],B=cons[b];if(a===b||A.c.length>=B.c.length)continue;
     if(!A.c.every(function(j){return B.c.indexOf(j)>-1}))continue;var d=B.c.filter(function(j){return A.c.indexOf(j)<0}),dn=B.n-A.n;
     if(dn===d.length){d.forEach(function(j){Mi[j]=1});ch=true}else if(dn===0){d.forEach(function(j){S[j]=1});ch=true}}}}
  var P={},fr={},others=[],exp=0,rem=left()-Object.keys(Mi).length;
  cons.forEach(function(o){var p=o.n/o.c.length;o.c.forEach(function(j){fr[j]=1;P[j]=Math.max(P[j]||0,p)})});
  Object.keys(fr).forEach(function(j){if(!Mi[j]&&!S[j])exp+=P[j]});
  for(k=0;k<N;k++)if(!op[k]&&!own[k]&&!Mi[k]&&!S[k]&&!fr[k])others.push(k);
  var dens=others.length?Math.max(0,Math.min(1,(rem-exp)/others.length)):0;
  others.forEach(function(j){P[j]=dens});Object.keys(Mi).forEach(function(j){P[j]=1});Object.keys(S).forEach(function(j){P[j]=0});
  return {Mi:Object.keys(Mi).map(Number),P:P}}
 function cpuPick(){var a=analyze(lv>=2),cand=[],k,best=-1;

  if(lv>=1&&canBomb(2)){var bb=-1,bv=0,y,x,q;for(k=0;k<N;k++){var r=k/W|0,c=k%W,v=0;for(y=r-2;y<=r+2;y++)for(x=c-2;x<=c+2;x++)if(y>=0&&y<H&&x>=0&&x<W){q=y*W+x;if(!op[q]&&!own[q])v+=a.P[q]||0}if(v>bv){bv=v;bb=k}}
   if(bb>-1&&bv>=(lv===2?3:3.5)&&(sc[1]-sc[2]>=3||sc[1]>=18))return {k:bb,bomb:true}}
  for(k=0;k<N;k++)if(!op[k]&&!own[k]){var p=(a.P[k]==null?.2:a.P[k])+Math.random()*(lv===0?.35:.02);if(p>best){best=p;cand=[k]}}

   (over?'<button class="btn" id="mfa2">Nog een keer</button>':(solo?'':'<button class="btn alt" id="mfr">'+(rz?'Zeker weten? Tik nog een keer':'🏳️ Opgeven')+'</button>')+'<button class="btn alt" id="mfn">Nieuw spel</button>')+'<button class="btn alt" id="mfm2">Andere spelvorm</button>';

 function soloTap(k,flag){if(over)return;
  if(flag||fm){if(op[k])return;fl[k]=fl[k]?0:1;draw();return}
  if(fl[k])return;
  if(first){place(nb(k).concat(k));first=false;t0=Date.now();tm=setInterval(function(){var e=$('#mft');if(!e){clearInterval(tm);return}if(!over)e.textContent=secs()},1000)}
  if(op[k]){if(!num[k]||nb(k).filter(function(j){return fl[j]}).length!==num[k])return;var bad=-1;nb(k).forEach(function(j){if(!fl[j]&&!op[j]){if(mine[j])bad=j;else flood(j)}});if(bad>-1)return lose(bad)}
  else if(mine[k])return lose(k);else flood(k);
  last=k;soloWin();draw()}

 /* ---- tikken ---- */
 function tap(k){if(solo)return soloTap(k,false);if(over||busy||!isHuman(turn))return;
  if(bm){if(bt===k){doBomb(k,turn);draw();cpuGo();return}bt=k;msg='Tik nog een keer op dit vak om de bom te gooien.';draw();return}
  if(op[k]||own[k])return;var p=turn,hit=move(k,p);rz=false;
  msg=hit?(over?'':name(p)+(mode==='cpu'?' vond een mijn! Je bent nog een keer.':' vond een mijn en is nog een keer.')):(mode==='twee'?name(turn)+' is aan de beurt.':'');
  draw();cpuGo()}

 /* ---- tekenen ---- */
 function cell(k){var cls='mf-c',h='',pv=false;
  if(bm&&bt>-1)pv=Math.abs((k/W|0)-(bt/W|0))<=2&&Math.abs(k%W-bt%W)<=2;
  if(own[k]){cls+=' f';h=mfFlag(MFC[own[k]])}
  else if(op[k]){cls+=' o';if(num[k]){h=num[k];cls+=' n'+num[k]}}
  else if(over&&mine[k]&&!(solo&&fl[k])){cls+=k===boom?' x':' o';h='💣'}
  else if(over&&solo&&fl[k]&&!mine[k]){cls+=' o';h='❌'}
  else{cls+=' c';if(fl[k])h=mfFlag(MFC[1])}
  if(k===last&&!solo)cls+=' l';if(pv)cls+=' pv';
  return '<button class="'+cls+'" data-k="'+k+'" aria-label="rij '+((k/W|0)+1)+' kolom '+(k%W+1)+'">'+h+'</button>'}
 function pan(p){var on=!over&&turn===p,cb=canBomb(p)&&on&&isHuman(p)&&!busy,av=mode==='cpu'?(p===1?'🙂':'🤖'):(p===1?'🔴':'🔵'),
   st=over?(res===p?'🏆 winnaar!':''):on?(busy&&p===2?'denkt na…':'aan de beurt'):(bomb[p]?'':'bom gebruikt');
  return '<div class="mf-p mf-'+(p===1?'r':'b')+(on?' on':'')+'"><div class="mf-av">'+av+'</div><div class="mf-nm"><b>'+name(p)+'</b><small>'+st+'</small></div><div class="mf-sc">'+mfFlag(MFC[p])+'<b>'+sc[p]+'</b></div><button class="mf-bomb'+(bm&&on?' act':'')+'" data-bomb="'+p+'"'+(cb?'':' disabled')+' aria-label="Bom gooien" title="'+(bomb[p]?'Bom: alleen als je achter staat':'De bom is al gebruikt')+'">'+(bomb[p]?bombSvg(34):'✖️')+'</button></div>'}
 function endBox(){var t,s='';
  if(solo){t=res===1?'Gewonnen! 🎉':'Boem! 💥';s=res===1?'Alle mijnen ontweken in '+secs()+' seconden. '+msg:'Je raakte een mijn.'}
  else{t=mode==='cpu'?(res===1?'Jij wint! 🎉':'De computer wint'):name(res)+' wint! 🎉';s=(quit?name(other(res))+' gaf op. ':'')+'Rood '+sc[1]+' – '+sc[2]+' Blauw'}
  return '<div class="mf-end"><div><h2>'+t+'</h2><p class="sub">'+s+'</p><button class="btn" id="mfa">Nog een keer</button><button class="btn alt" id="mfv">Bekijk het bord</button><button class="btn alt" id="mfm">Andere spelvorm</button></div></div>'}
 function draw(){var nf=fl.filter(Boolean).length,mid;
  if(solo)mid=(over?'':'Tik om te openen. Houd ingedrukt, rechtsklik of zet 🚩 aan voor een vlag.')+(msg&&!over?'<br>'+msg:'');
  else mid='Nog <b>'+left()+'</b> mijnen · <b>'+WIN+'</b> nodig om te winnen'+(bm?'<br><b>💣 Kies waar de bom moet vallen.</b>':'')+(msg?'<br>'+msg:'');
  var panels=solo?'<div class="mf-p mf-r on"><div class="mf-av">🙋</div><div class="mf-nm"><b>Jij</b><small>'+(over?(res===1?'🏆 gewonnen':'💥 boem'):'')+'</small></div><div class="mf-sc">'+mfFlag(MFC[1])+'<b>'+(M-nf)+'</b></div><div class="mf-sc">⏱️<b id="mft">'+secs()+'</b></div><button class="mf-bomb'+(fm?' act':'')+'" id="mffm" aria-pressed="'+fm+'" aria-label="Vlag-stand" title="Vlag-stand">🚩</button></div>':pan(2)+pan(1);
  app.innerHTML=OTOP+'<h1>Mijnenveger Flags</h1><div class="mf'+(solo?' solo':'')+'">'+panels+'<div class="mf-m">'+mid+'</div><div class="mf-bw"><div class="mf-bd" id="mfb" style="grid-template-columns:repeat('+W+',minmax(0,1fr))">'+Array.apply(null,Array(N)).map(function(_,k){return cell(k)}).join('')+'</div>'+(over&&!hideEnd?endBox():'')+'</div></div><div class="mfbtns">'+
   (over?'<button class="btn" id="mfa2">Nog een keer</button>':(solo?'':'<button class="btn rs" id="mfr">'+(rz?'Zeker weten? Tik nog eens':'Opgeven')+'</button>')+'<button class="btn alt" id="mfn">Nieuw spel</button>')+'<button class="btn alt" id="mfm2">Andere spelvorm</button></div>';
  var bye=function(){clearInterval(tm);over=true},again=function(){bye();mfPlay(mode)},menu=function(){bye();mijnenFlags()};
  $('#bk').onclick=menu;$('#mfm2').onclick=menu;
  if($('#mfa'))$('#mfa').onclick=again;if($('#mfa2'))$('#mfa2').onclick=again;if($('#mfn'))$('#mfn').onclick=again;if($('#mfm'))$('#mfm').onclick=menu;
  if($('#mfv'))$('#mfv').onclick=function(){hideEnd=true;draw()};
  if($('#mfr'))$('#mfr').onclick=function(){if(busy)return;if(!rz){rz=true;draw();return}quit=true;over=true;res=mode==='cpu'?2:other(turn);bm=false;draw()};
  if($('#mffm'))$('#mffm').onclick=function(){fm=!fm;draw()};
  document.querySelectorAll('[data-bomb]').forEach(function(b){b.onclick=function(){var p=Number(b.dataset.bomb);if(p!==turn||!canBomb(p)||busy)return;bm=!bm;bt=-1;msg='';draw()}});
  var bd=$('#mfb');
  bd.onclick=function(e){var t=e.target.closest('[data-k]');if(!t)return;if(lpDone){lpDone=false;return}tap(Number(t.dataset.k))};
  if(solo){bd.oncontextmenu=function(e){e.preventDefault();var t=e.target.closest('[data-k]');if(t)soloTap(Number(t.dataset.k),true)};
   bd.onpointerdown=function(e){if(e.pointerType==='mouse')return;var t=e.target.closest('[data-k]');if(!t)return;lpDone=false;clearTimeout(lp);lp=setTimeout(function(){lpDone=true;soloTap(Number(t.dataset.k),true);try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}},420)};
   bd.onpointerup=bd.onpointercancel=bd.onpointerleave=function(){clearTimeout(lp)}}}
 draw();cpuGo()}

const CATALOG=[
 {id:'eilanders',name:'Eilanders',desc:'Bouw dorpen, steden en straten op een eiland vol grondstoffen. Ruilen, roven en racen naar 10 punten.',meta:'2–4 spelers · ca. 60 min',min:2,max:4},
 {id:'rummy',name:'Tegelrummy',desc:'Leg series en groepen van genummerde stenen en schuif slim met wat er op tafel ligt.',meta:'2–4 spelers · ca. 45 min',min:2,max:4},
 {id:'ezel',name:'Ezelen',desc:'Pak tegels uit de berg, leg ze op volgorde in het midden en dump ze bij je medespelers. Pas op voor de ezel!',meta:'2–4 spelers · ca. 30 min',min:2,max:4},
 {id:'eentje',name:'Eentje!',desc:'Leg kaarten op kleur of getal, pest met +2, +4 en Overslaan, en vergeet niet Eentje! te roepen.',meta:'2–4 spelers · ca. 20 min',min:2,max:4},
 {id:'fase',name:'Tien Fasen',desc:'Werk je door tien opdrachten met gelijke kaarten, reeksen en kleuren.',meta:'2–4 spelers · ca. 60 min',min:2,max:4},
 {id:'bever',name:'Beverdam',desc:'Onthoud je verborgen kaarten, ruil slim en roep op tijd voor het laagste totaal.',meta:'2–4 spelers · ca. 20 min',min:2,max:4}];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clone=o=>JSON.parse(JSON.stringify(o));
let myId=ls.get('spelkast-id');if(!myId){myId='p'+Math.random().toString(36).slice(2,10);ls.set('spelkast-id',myId)}
let myName=ls.get('spelkast-name')||'';
let localBot=[false,false,false,false],lastHuman=-1,botT=null,gopts={},gid=null,view='hub',mode=null,S=null,ui={},sheet=null,cover=null,lastActor=-1,code=null,db=null,dbState='wait',unsub=null,writing=false,toastT=null,localN=3,localNames=['','','',''];
const cat=id=>CATALOG.find(c=>c.id===id);
function optsFor(g,n,src){const o={};(UIS[g].options||[]).forEach(d=>{const v=src&&src[d.k];o[d.k]=d.choices.includes(v)?v:d.def(n)});return o}
function optsHTML(g,n,src,act,enabled){return (UIS[g].options||[]).map(d=>{const v=optsFor(g,n,src)[d.k];return `<span class="lbl">${esc(d.label)}</span><div class="seg wrapseg">${d.choices.map(c=>`<button class="${c===v?'on':''}" ${enabled?`data-a="${act}" data-k="${d.k}" data-v="${c}"`:'disabled'}>${c}</button>`).join('')}</div>${d.note?`<p class="note">${esc(d.note(v))}</p>`:''}`}).join('')}
function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2800)}
function hexPts(x,y,r,flat){const p=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-(flat?0:30));p.push((x+r*Math.cos(a)).toFixed(3)+','+(y+r*Math.sin(a)).toFixed(3))}return p.join(' ')}
function meIdx(){if(!S||!S.players||S.status==='lobby')return -1;
 if(mode!=='local')return S.players.findIndex(p=>p.id===myId);
 const a=ENG[gid].actor(S);if(S.players[a]&&!S.players[a].bot)return a;
 if(lastHuman>=0&&S.players[lastHuman]&&!S.players[lastHuman].bot)return lastHuman;return S.players.findIndex(p=>!p.bot)}
const pc=i=>COL[(S.players[i]||{}).color]||COL[0];
const dot=(i,sz)=>`<span class="dot" style="background:${pc(i).h}${sz?';width:'+sz+'px;height:'+sz+'px':''}"></span>`;
const pname=i=>esc(S.players[i].name);
// spelersbalk: items = per speler [stat-strings], on = actieve index
function pstrip(stats,on,me){return `<div class="pls">${S.players.map((p,i)=>`<div class="pl ${i===on?'on':''}"><div class="nm">${dot(i)}<span>${esc(p.name)}${i===me&&mode==='online'?' (jij)':''}</span></div><div class="st">${stats(i)}</div></div>`).join('')}</div>`}
function status(txt,my){return `<div class="status ${my?'me':''}">${esc(txt)}</div>`}
function shell(title,body,closable=true){return `<div class="ov" ${closable?'data-a="closeOv"':''}><div class="sh" role="dialog" aria-label="${esc(title)}"><div class="shx"><h2>${esc(title)}</h2>${closable?'<button class="x" data-a="close" aria-label="Sluiten">×</button>':''}</div>${body}</div></div>`}

function heroArt(){
 const T={wood:'#3f8a45',brick:'#cf6d3e',sheep:'#9fd05c',wheat:'#efc23d',ore:'#9aa1ad'};
 let h=`<svg viewBox="-4.6 -2.4 10.4 4.6" aria-hidden="true">`;
 [['wood',-2.6,.2],['wheat',-.87,-.8],['ore',.87,.2],['sheep',2.6,-.8],['brick',-.87,1.2]].forEach(([r,x,y])=>{h+=`<polygon points="${hexPts(x,y+.12,.96)}" fill="#000" opacity=".25"/><polygon points="${hexPts(x,y,.96)}" fill="${T[r]}" stroke="#5b4326" stroke-width=".05"/><use href="#m-${r}" transform="translate(${x},${y-.05}) scale(2.2)"/>`});
 const card=(x,y,rot,bg,txt,fg)=>`<g transform="translate(${x},${y}) rotate(${rot})"><rect x="-.55" y="-.75" width="1.1" height="1.5" rx=".14" fill="#000" opacity=".25" transform="translate(.06,.08)"/><rect x="-.55" y="-.75" width="1.1" height="1.5" rx=".14" fill="${bg}" stroke="#2a2016" stroke-width=".05"/><text y=".2" text-anchor="middle" font-size=".7" font-weight="800" font-family="Baloo 2,sans-serif" fill="${fg}">${txt}</text></g>`;
 h+=card(3.9,.55,12,'#fffaf0','7','#2a62c9')+card(4.6,.2,24,'#f08a1c','10','#fff');
 h+=`<g transform="translate(-3.9,-1.4) rotate(-12)"><rect x="-.4" y="-.4" width=".8" height=".8" rx=".16" fill="#fffaf0" stroke="#5b4326" stroke-width=".05"/><circle r=".09" fill="#c0281f"/></g>`;
 h+=`<g transform="translate(2.5,1.6) rotate(-8)"><rect x="-.42" y="-.55" width=".84" height="1.1" rx=".12" fill="#f7eed6" stroke="#5b4326" stroke-width=".05"/><text y=".2" text-anchor="middle" font-size=".55" font-weight="800" font-family="Baloo 2,sans-serif" fill="#c0281f">12</text></g>`;
 return h+'</svg>';
}
function vHub(){
 return `<header class="hero"><div class="wrap"><div class="brandline"><img class="brandicon" src="${ICON_IMG}" alt="" width="30" height="30"><span>DE SPEELKAMER</span><span class="brandpill">${CATALOG.length} spellen</span></div><div class="herocopy"><div><span class="eyebrow">SAMEN SPELEN IS LEUKER</span><h1>Spellenkast<span>.</span></h1><p>Schuif aan, kies een spel en maak er een mooie speelronde van.</p></div><div class="heroart"><img class="herologo" src="${LOGO_IMG}" alt="Spellenkast-logo: een open schatkist vol dobbelstenen, kaarten en pionnen" width="560" height="549"></div></div><div class="herofoot"><span>♟ 2–4 spelers</span><span>✦ Direct spelen</span><span>♥ Voor iedereen</span></div></div></header>
 <main class="wrap hubmain"><div class="sectionintro"><div><span class="eyebrow">KIES JE SPEL</span><h2>Wat gaan we spelen?</h2></div><span class="sectionhint">De spellenkast</span></div><div class="games">${(()=>{const o=opens();return sortedCatalog().map(g=>`<button class="gcard" data-a="open" data-v="${g.id}">${g.emb?embIcon(g):UIS[g.id].icon()}<div><h2>${esc(g.name)}</h2><p>${esc(g.desc)}</p><span class="tag">${(o[g.id]||0)>=5?'Vaak gespeeld · ':''}${esc(g.meta)} · Spelen</span></div></button>`).join('')})()}
 <div class="gcard soon"><svg viewBox="-1.1 -1.1 2.2 2.2"><polygon points="${hexPts(0,0,1)}" fill="none" stroke="currentColor" stroke-width=".06" stroke-dasharray=".15 .1" opacity=".5"/><text y=".2" text-anchor="middle" font-size=".7" font-weight="800" fill="currentColor" opacity=".5">+</text></svg><div><h2>Volgend spel</h2><p>Hier komt het volgende spel in de kast.</p><span class="tag muted">Binnenkort</span></div></div></div><p class="disc">${esc(DISCLAIMER)}<br><button class="lockbtn" data-a="lock">Dit toestel vergrendelen</button></p></main>`;
}

   if(p==='querySelector')return s=>root.querySelector(s);

   if(p==='getElementById')return id=>root.getElementById(id);
