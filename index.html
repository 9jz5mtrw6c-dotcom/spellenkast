<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spelkast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: speels, warm, een gezellige spelavond aan de keukentafel.
IDEA: een spellenkast; elk spel is een doos. Eilanders is een eiland in een diepe zee.
PICTURE: het zeshoekige eiland zelf is het beeld; op de hoofdpagina een stapel tegels met dobbelstenen.
COLOUR and TYPE: diep zeeblauw-groen dominant, zand als steun, koraal als accent. Baloo 2 + Nunito.
LAYOUT: telefoon eerst; bord bovenaan, hand en knoppen onderin binnen duimbereik.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f4e9cf,#0c2a33);--panel:light-dark(#fffaf0,#123a46);--panel2:light-dark(#efe2c3,#0f323d);
--ink:light-dark(#1f2a2e,#f3ecdc);--mute:light-dark(#5d6a6e,#a9bcc0);--line:light-dark(#dccca6,#24525f);
--sea:#0e5a73;--sea2:#0a4253;--shallow:#2f86a0;--coral:#e4572e;--coral2:#c9431d;--sand:#f4e6c4}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3{font-family:"Baloo 2",Nunito,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:46px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 16px;border-radius:14px;font-weight:800;background:var(--coral);color:#fff;box-shadow:0 3px 0 var(--coral2);width:100%}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral2)}
.btn.alt{background:var(--panel);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.sea{background:var(--sea);box-shadow:0 3px 0 var(--sea2)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.muted{color:var(--mute)}.small{font-size:14px}
/* hub */
.hero{background:radial-gradient(120% 90% at 70% 10%,#1a7690 0%,var(--sea) 45%,var(--sea2) 100%);color:#fbf3df;padding:28px 0 0;overflow:hidden}
.hero .wrap{display:grid;gap:6px}
.hero h1{font-size:clamp(44px,12vw,64px);font-weight:800;letter-spacing:-.5px}
.hero p{margin:0;font-size:17px;color:#cfe6ea;max-width:30ch}
.hero svg{display:block;width:100%;height:auto;margin-top:8px}
.games{display:grid;gap:14px;padding:22px 0 40px}
.gcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line);width:100%}
.gcard h2{font-size:26px}.gcard p{margin:2px 0 0;color:var(--mute);font-size:15px}
.gcard .tag{display:inline-block;margin-top:8px;font-size:13px;font-weight:800;color:var(--coral)}
.gcard.soon{border-style:dashed;box-shadow:none;opacity:.8;cursor:default}
.gcard svg{width:96px;height:96px}
/* menu */
.mhead{background:var(--sea);color:#fbf3df;padding:14px 0 18px}
.mhead .row{display:flex;align-items:center;gap:10px}
.back{min-height:44px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-weight:800}
.mhead h1{font-size:40px;margin-top:8px}
.mhead p{margin:4px 0 0;color:#cfe6ea}
.stack{display:grid;gap:12px;padding:20px 0 40px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.card h3{font-size:22px}
.note{font-size:14px;color:var(--mute);margin:0}
.seg{display:flex;gap:8px}.seg button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);font-weight:800;background:var(--panel)}
.seg button.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.code{font-family:"Baloo 2";font-size:56px;font-weight:800;letter-spacing:8px;text-align:center;color:var(--coral)}
.plist{display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);font-weight:700}
.dot{width:18px;height:18px;border-radius:6px;flex:none;border:2px solid rgba(0,0,0,.35)}
/* game */
.g{max-width:720px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.gtop{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--sea);color:#fff}
.gtop .ttl{flex:1;font-weight:800;font-size:15px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:44px;min-height:40px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:800;padding:0 10px}
.pls{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;padding:8px 8px 4px}
.pl{border-radius:12px;background:var(--panel);border:2px solid var(--line);padding:6px 7px;display:grid;gap:2px;font-size:13px;line-height:1.2}
.pl.on{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral) inset}
.pl .nm{display:flex;align-items:center;gap:5px;font-weight:800;white-space:nowrap;overflow:hidden}
.pl .nm span{overflow:hidden;text-overflow:ellipsis}
.pl .dot{width:12px;height:12px;border-radius:4px}
.pl .st{display:flex;gap:7px;color:var(--mute);font-weight:700;flex-wrap:wrap}
.pl .vp{color:var(--ink);font-weight:800}
.bdg{display:inline-block;padding:0 5px;border-radius:6px;background:var(--coral);color:#fff;font-size:11px;font-weight:800}
.status{margin:4px 8px;padding:9px 12px;border-radius:12px;background:var(--panel2);font-weight:800;font-size:15px;text-align:center;min-height:42px}
.status.me{background:var(--coral);color:#fff}
.bw{position:relative;margin:0 8px;border-radius:22px;background:radial-gradient(circle at 50% 45%,var(--shallow),var(--sea) 60%,var(--sea2));overflow:hidden}
.bw svg{display:block;width:100%;height:auto;touch-action:manipulation}
.dice{position:absolute;left:8px;top:8px;display:flex;gap:5px}
.dice svg{width:30px;height:30px}
.logl{margin:6px 12px 0;color:var(--mute);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.logbtn{position:absolute;right:8px;top:8px;min-height:36px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:13px}
.hand{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;padding:8px 8px 4px}
.rc{border-radius:10px;padding:4px 2px 3px;display:grid;justify-items:center;gap:0;font-weight:800;color:#1d2427;border:2px solid rgba(0,0,0,.15);font-size:17px;line-height:1.1}
.rc svg{width:28px;height:28px}
.rc small{font-size:11px;font-weight:700;opacity:.85}
.rc.dev{background:var(--panel);color:var(--ink);border-color:var(--line)}
.rc.zero{opacity:.45}
.acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 8px 12px}
.ab{min-height:58px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-weight:800;font-size:13px;display:grid;justify-items:center;align-content:center;gap:3px;padding:4px 2px;line-height:1.1}
.ab.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.ab.pri{background:var(--coral);border-color:var(--coral2);color:#fff}
.ab:disabled{opacity:.4;cursor:default}
.ab.wide{grid-column:span 2}
.cost{display:flex;gap:2px}.cost i{width:9px;height:9px;border-radius:3px;border:1px solid rgba(0,0,0,.3)}
.offer{margin:0 8px 6px;padding:10px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--coral);display:grid;gap:8px;font-weight:700}
.offer .row{display:flex;gap:8px}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(5,20,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sh{animation:none}.tgt{animation:none!important}}
.sh h2{font-size:26px}
.shx{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{min-width:44px;min-height:44px;border-radius:12px;background:var(--panel2);font-weight:800;font-size:20px}
.rgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpick{border-radius:12px;padding:6px 2px;display:grid;justify-items:center;font-weight:800;color:#1d2427;border:3px solid transparent;font-size:13px;min-height:64px}
.rpick svg{width:30px;height:30px}
.rpick.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.rpick:disabled{opacity:.35}
.step{display:grid;justify-items:center;gap:4px}
.step .n{font-weight:800;font-size:18px}
.step .pm{display:flex;gap:4px}
.step .pm button{width:32px;height:34px;border-radius:9px;background:var(--panel);border:2px solid var(--line);font-weight:800}
.lbl{font-weight:800;font-size:15px}
.dl{display:grid;gap:8px}
.drow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--panel);border:2px solid var(--line)}
.drow .t{flex:1}.drow b{display:block}.drow span{font-size:14px;color:var(--mute)}
.drow .btn{width:auto;min-height:42px}
.tabs{display:flex;gap:6px}.tabs button{flex:1;min-height:44px;border-radius:12px;font-weight:800;background:var(--panel2)}
.tabs button.on{background:var(--sea);color:#fff}
.rules p{margin:0 0 8px}.rules h3{font-size:19px;margin:12px 0 4px}
.logfull{display:grid;gap:4px;font-size:14px}
.cover{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--sea);color:#fff;text-align:center;padding:24px}
.cover h2{font-size:34px;margin:12px 0}
.cover .btn{max-width:320px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d2427;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;z-index:40;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.tgt{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.win{text-align:center}.win h2{font-size:34px}
.score{display:grid;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gtop .ib{flex:none}
.empty{color:var(--mute);font-size:14px;margin:6px;text-align:center;width:100%}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px;width:auto}
.sec{padding:4px 10px;display:grid;gap:6px}
/* tegelrummy */
.felt{margin:4px 8px;padding:10px 8px;border-radius:18px;background:#2f7a55;min-height:120px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;position:relative}
.potc{position:absolute;right:10px;top:-10px;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:0 8px;font-size:12px;font-weight:800}
.rset{display:flex;gap:2px;padding:4px;border-radius:10px;background:rgba(0,0,0,.18);align-items:center;flex-wrap:wrap}
.rset.bad{background:rgba(220,40,30,.45);outline:2px dashed #ffd3cc}
.tl{width:30px;height:40px;border-radius:6px;background:#f7eed6;border:1px solid #8a7350;box-shadow:0 2px 0 #8a7350;display:grid;place-items:center;font:800 18px/1 "Baloo 2",sans-serif;padding:0}
.tl.sel{transform:translateY(-5px);outline:3px solid var(--coral);outline-offset:1px}
.tadd{width:30px;height:40px;border-radius:6px;border:2px dashed #fff;color:#fff;font-weight:800;font-size:20px}
.tadd:disabled{opacity:.35}
.rack{margin:6px 8px;padding:10px 8px;border-radius:14px;background:#b8875a;display:flex;flex-wrap:wrap;gap:4px;min-height:60px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
/* ezelen */
.ezh{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:14px 10px 4px}
.ez{aspect-ratio:5/7;border-radius:12px;background:#fffaf0;border:3px solid var(--c);display:grid;place-items:center;align-content:center;gap:2px;font-weight:800;color:#2a2016;box-shadow:0 3px 0 rgba(0,0,0,.2);padding:4px}
.ez svg{width:70%;height:auto}
.ez.sel{transform:translateY(-10px);box-shadow:0 0 0 4px var(--coral)}
.ez:not([data-a]){cursor:default}
.grab{display:block;width:calc(100% - 16px);margin:10px 8px;min-height:84px;border-radius:22px;background:var(--coral);color:#fff;font:800 40px/1 "Baloo 2",sans-serif;box-shadow:0 5px 0 var(--coral2)}
.grab:disabled{opacity:.35}
.ltr{display:inline-flex;gap:2px}.ltr b{width:16px;text-align:center;border-radius:4px;background:var(--panel2);color:var(--mute);font-size:12px}.ltr b.on{background:var(--coral);color:#fff}
/* tien fasen */
.fc{--w:50px;width:var(--w);height:calc(var(--w)*1.4);flex:none;border-radius:8px;background:var(--bg,#555);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 2px 0 rgba(0,0,0,.2);color:#fff;display:grid;place-items:center;align-content:center;padding:0;font-family:"Baloo 2",sans-serif;line-height:1}
.fc b{font-size:24px}.fc small{font-size:9px;font-weight:800}
.fc.sm{--w:30px;border-width:1px}.fc.sm b{font-size:15px}.fc.sm small{display:none}.fc.sm svg{width:16px;height:16px}
.fc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--coral)}
.fc.dim{opacity:.3}
.fc.back{background:linear-gradient(135deg,#0e5a73,#1a7690)}
.fc.empty{background:transparent;border:2px dashed var(--line);box-shadow:none}
.pile{display:flex;gap:10px;align-items:center;padding:8px 10px}
.pile .mine{display:grid;flex:1;font-size:14px;line-height:1.3}.pile .mine span{color:var(--mute)}
.laid{display:grid;gap:6px;padding:4px 8px}
.lg{display:flex;gap:6px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:5px 6px}
.lgc{display:flex;flex-wrap:wrap;gap:3px;flex:1}
.lg .tadd{border-color:var(--coral);color:var(--coral);height:42px}
.fhand{display:flex;flex-wrap:wrap;gap:5px;padding:14px 8px 4px;justify-content:center}
/* beverdam */
.bc{--w:62px;width:var(--w);height:calc(var(--w)*1.4);flex:none;border-radius:10px;background:var(--bg,#7a4a26);border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.2);color:#fff;display:grid;place-items:center;align-content:center;padding:0;font-family:"Baloo 2",sans-serif;line-height:1}
.bc b{font-size:30px}.bc small{font-size:11px;font-weight:800}
.bc.back{background:repeating-linear-gradient(135deg,#7a4a26 0 8px,#6b3f1f 8px 16px)}
.bc.sm{--w:30px;border-width:1px}.bc.sm b{font-size:16px}.bc.sm small{display:none}
.bc.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--coral)}
.bc[data-a]{cursor:pointer}
.opps{display:grid;gap:6px;padding:4px 10px}
.opp{display:flex;gap:8px;align-items:center;font-weight:700;font-size:14px}.opp>span:nth-child(2){flex:1}
.bhand{padding:10px;display:grid;gap:6px;justify-items:center}
.bhand .row{gap:10px}
/* bonenboer */
.bn{display:grid;justify-items:center;align-content:start;gap:1px;width:78px;min-height:96px;padding:6px 3px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-size:12px;line-height:1.15;position:relative}
.bn b{font-size:12px}
.bn .mt{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.mt i{font-style:normal;font-size:10px;font-weight:800;background:var(--panel2);border-radius:4px;padding:0 3px}
.bn.sm{width:58px;min-height:0;padding:4px 2px}
.bn.sel{border-color:var(--coral);box-shadow:0 0 0 2px var(--coral)}
.bn em{position:absolute;top:-8px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-style:normal;font-size:10px;font-weight:800;border-radius:6px;padding:0 5px}
.bh{flex-wrap:nowrap;overflow-x:auto;padding-top:8px}
.fcol{display:grid;gap:4px;justify-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;padding:6px 8px}
.fld{border-radius:16px;background:#8b5a2b;color:#fff8ea;padding:10px 6px;display:grid;justify-items:center;gap:2px;min-height:150px;align-content:center;text-align:center;border:3px solid transparent}
.fld .note{color:#f1dfbf}.fld .cnt{font:800 30px/1 "Baloo 2",sans-serif}
.fld.can{border-color:#fff;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
.fld.add{background:transparent;border:3px dashed var(--line);color:var(--ink);min-height:150px}.fld.add .note{color:var(--mute)}
.hv{margin-top:4px;min-height:36px;padding:0 10px;border-radius:10px;background:#f4e6c4;color:#3a2a17;font-weight:800;font-size:13px}
.wantg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.wt{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 6px;font-size:13px;font-weight:700}
.wt span{flex:1}.wt .pm{display:flex;align-items:center;gap:4px}
.wt .pm button{width:30px;height:32px;border-radius:8px;background:var(--panel2);font-weight:800}
@media (prefers-reduced-motion:reduce){.fld.can{animation:none}}
.felt .empty{color:#d8efe2}
.fld .mt i{background:rgba(0,0,0,.28);color:#fff}
.bn.sm b{font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st{align-items:center}
/* ezelen (eigen variant) */
.et{--w:46px;width:var(--w);height:calc(var(--w)*1.25);flex:none;border-radius:8px;background:#f7eed6;border:1px solid #8a7350;box-shadow:0 3px 0 #8a7350;display:grid;place-items:center;align-content:center;padding:0;font-family:"Baloo 2",sans-serif;line-height:1;position:relative}
.et b{font-size:22px}.et small{position:absolute;bottom:2px;font-size:9px;font-weight:800;color:#6b5a3e}
.et.big{--w:72px}.et.big b{font-size:34px}
.et.back{background:repeating-linear-gradient(135deg,#0e5a73 0 8px,#0a4a5f 8px 16px);color:#fff}.et.back small{color:#cfe6ea}
.et.empty{background:transparent;border:2px dashed var(--line);box-shadow:none;color:var(--mute);font-weight:800;font-size:15px}
.et.sel{outline:3px solid var(--sea);outline-offset:2px}
.et.tg{outline:3px solid var(--coral);outline-offset:2px;animation:pulse 1.2s ease-in-out infinite}
.emid{margin:6px 8px;padding:10px;border-radius:16px;background:var(--panel2);display:grid;gap:8px}
.emid .row{gap:10px;min-height:58px}
.eopp{display:grid;gap:6px;padding:4px 10px}
.eo{display:flex;align-items:center;gap:8px;font-weight:700;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 8px}.eo>span:nth-child(2){flex:1}
.eown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 8px 0;justify-items:center}
.ec{display:grid;justify-items:center;gap:4px}.ec .lbl{font-size:13px}
@media (prefers-reduced-motion:reduce){.et.tg{animation:none}}
.eberg{margin:6px 8px;display:grid;gap:6px}
.eheap{display:flex;flex-wrap:wrap;gap:4px;padding:10px;border-radius:16px;background:#2f6a7d;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}

<script>
{
const RES=['wood','brick','sheep','wheat','ore'];
const NAMES={wood:'hout',brick:'leem',sheep:'wol',wheat:'graan',ore:'erts'};
const CAP={wood:'Hout',brick:'Leem',sheep:'Wol',wheat:'Graan',ore:'Erts'};
const COST={road:{wood:1,brick:1},settle:{wood:1,brick:1,sheep:1,wheat:1},city:{wheat:2,ore:3},dev:{sheep:1,wheat:1,ore:1}};
const DEVN={knight:'Ridder',vp:'Overwinningspunt',road:'Stratenbouw',plenty:'Uitvinding',mono:'Monopolie'};
const DEVD={knight:'Verplaats de rover en steel een kaart. Telt mee voor het grootste leger.',vp:'Telt als 1 punt. Blijft geheim tot het einde.',road:'Bouw meteen 2 gratis straten.',plenty:'Pak 2 grondstoffen naar keuze van de bank.',mono:'Kies een grondstof: iedereen geeft jou al die kaarten.'};
const R3=Math.sqrt(3);
const HX=[],V=[],E=[];
(()=>{const vk={},ek={};
for(let q=-2;q<=2;q++)for(let r=Math.max(-2,-q-2);r<=Math.min(2,-q+2);r++)HX.push({q,r,x:R3*(q+r/2),y:1.5*r,v:[]});
HX.forEach((h,hi)=>{
 for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30),x=h.x+Math.cos(a),y=h.y+Math.sin(a);
  const k=Math.round(x*1000)+','+Math.round(y*1000);
  if(vk[k]==null){vk[k]=V.length;V.push({x,y,h:[],adj:[],e:[]})}
  V[vk[k]].h.push(hi);h.v.push(vk[k])}
 for(let i=0;i<6;i++){const a=h.v[i],b=h.v[(i+1)%6],k=Math.min(a,b)+'-'+Math.max(a,b);
  if(ek[k]==null){ek[k]=E.length;E.push({a,b,h:[]});V[a].adj.push(b);V[b].adj.push(a);V[a].e.push(ek[k]);V[b].e.push(ek[k])}
  E[ek[k]].h.push(hi)}});
HX.forEach(h=>{h.n=[];HX.forEach((o,i)=>{const dq=o.q-h.q,dr=o.r-h.r;if(Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr)===2)h.n.push(i)})});
})();
const mid=i=>({x:(V[E[i].a].x+V[E[i].b].x)/2,y:(V[E[i].a].y+V[E[i].b].y)/2});

const rnd=n=>Math.floor(Math.random()*n);

const clean=r=>{const o=zero();RES.forEach(k=>{o[k]=Math.max(0,Math.min(19,((r&&r[k])|0)))});return o};
function log(S,m){S.log.push(m);if(S.log.length>60)S.log.splice(0,S.log.length-60)}

function makeBoard(){
 const tiles=shuffle([...Array(4).fill('wood'),...Array(3).fill('brick'),...Array(4).fill('sheep'),...Array(4).fill('wheat'),...Array(3).fill('ore'),'desert']);
 const base=[2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12];let nums;
 for(let t=0;t<3000;t++){const n=shuffle(base.slice());nums=tiles.map(r=>r==='desert'?0:n.pop());
  const hot=i=>nums[i]===6||nums[i]===8;
  if(!HX.some((h,i)=>hot(i)&&h.n.some(hot)))break}
 const types=shuffle(['any','any','any','any',...RES]);const st=rnd(30);
 const harbors=[0,3,7,10,13,17,20,23,27].map((o,i)=>({e:COAST[(st+o)%30],t:types[i]}));
 return {tiles,nums,robber:tiles.indexOf('desert'),harbors};
}

  S.peek={p:me,i,v:P.hand[i],n:S.turnNo};S.discard.push('k');log(S,P.name+' bekijkt een eigen kaart.');endTurn(S);return null;
 case 'trade':{
  if(S.step!=='action'||S.drawn!=='r')return 'Dat kan nu niet.';const q=a.p|0,j=a.j|0;const Q=S.players[q];
  if(!Q||q===me||i<0||i>3||j<0||j>3)return 'Kies twee kaarten.';
  [P.hand[i],Q.hand[j]]=[Q.hand[j],P.hand[i]];S.discard.push('r');log(S,P.name+' ruilt blind een kaart met '+Q.name+'.');endTurn(S);return null}
 case 'twice':
  if(S.step!=='action'||S.drawn!=='t')return 'Dat kan nu niet.';
  S.discard.push('t');S.drawn=null;S.two=1;S.step='two';log(S,P.name+' mag twee keer pakken.');return null;
 }
 return 'Onbekende actie.';
}
function results(S){return S.players.map((p,i)=>({p:i,n:p.score})).sort((a,b)=>a.n-b.n).map(r=>({p:r.p,txt:r.n+' punten'}))}
globalThis.ENG.bever={newGame,act,actor,results,isNum,NM};
}

<script>
{
// Computerspelers: per spel een functie (S, i) -> lijst kandidaat-acties, beste eerst.
// De speler probeert ze op volgorde; de eerste die de spelregels accepteren, wordt gespeeld.
const ENG=globalThis.ENG,BOTS={};
const pickR=a=>a[Math.floor(Math.random()*a.length)];

/* ---------------- Eilanders ---------------- */
{
const EN=globalThis.EN,{RES,HX,V,E,COST}=EN;
const pip=n=>n?6-Math.abs(7-n):0;
const vScore=(S,v)=>{let s=0;const seen=new Set();V[v].h.forEach(h=>{const r=S.board.tiles[h];if(r==='desert'||h===S.board.robber&&false)return;s+=pip(S.board.nums[h]);seen.add(r)});return s+seen.size*0.6};
const best=(S,list,f)=>list.slice().sort((a,b)=>f(b)-f(a));
function goal(S,i){const P=S.players[i];if(EN.spots(S,i,'city').length)return COST.city;if(EN.spots(S,i,'settle').length)return COST.settle;return P.left.settle>0?COST.road:COST.dev}
function roadPick(S,i){
 const list=EN.spots(S,i,'road');
 return best(S,list,e=>{const ends=[E[e].a,E[e].b];return Math.max(...ends.map(v=>(!S.bld[v]&&V[v].adj.every(a=>!S.bld[a]))?vScore(S,v):0))+Math.random()*.5});
}
BOTS.eilanders=(S,i)=>{
 const P=S.players[i],A=EN.actor(S),out=[];
 if(A!==i){
  const o=S.offer;if(o&&o.from!==i&&!o.no.includes(i)){const g=goal(S,i);const helps=RES.some(r=>o.give[r]&&P.res[r]<(g[r]||0));const spare=RES.every(r=>!o.get[r]||P.res[r]-o.get[r]>=(g[r]||0));out.push(helps&&spare&&EN.has(P.res,o.get)?{t:'accept'}:{t:'decline'},{t:'decline'})}
  return out}
 switch(S.phase){
 case 'setup':{if(S.need==='settle')return best(S,EN.spots(S,i,'settle'),v=>vScore(S,v)+Math.random()*.3).slice(0,5).map(v=>({t:'place',kind:'settle',i:v}));
  return roadPick(S,i).map(e=>({t:'place',kind:'road',i:e}))}
 case 'roll':{const onMe=HX[S.board.robber].v.some(v=>S.bld[v]&&S.bld[v].p===i);if(onMe)out.push({t:'play',c:'knight'});out.push({t:'roll'});return out}
 case 'discard':{const n=S.discardQ[0].n,r=EN.zero(),h={...P.res};for(let k=0;k<n;k++){const m=RES.slice().sort((a,b)=>h[b]-h[a])[0];h[m]--;r[m]++}return [{t:'discard',res:r}]}
 case 'robber':{const opp=h=>{let s=0,mine=false;HX[h].v.forEach(v=>{const b=S.bld[v];if(b){if(b.p===i)mine=true;else s+=(b.c?2:1)*pip(S.board.nums[h])*(1+EN.vp(S,b.p,false)/5)}});return mine?-1:s};
  return best(S,HX.map((h,k)=>k).filter(k=>k!==S.board.robber),opp).slice(0,3).map(h=>({t:'robber',i:h}))}
 case 'steal':return S.stealFrom.slice().sort((a,b)=>EN.total(S.players[b].res)-EN.total(S.players[a].res)).map(p=>({t:'steal',p}));
 case 'roadbuild':return [...roadPick(S,i).slice(0,3).map(e=>({t:'place',kind:'road',i:e})),{t:'rbdone'}];
 case 'main':{
  if(S.offer&&S.offer.from===i)return [{t:'cancel'}];
  const can=k=>EN.has(P.res,COST[k]);
  if(can('city'))EN.spots(S,i,'city').sort((a,b)=>vScore(S,b)-vScore(S,a)).forEach(v=>out.push({t:'place',kind:'city',i:v}));
  if(can('settle'))best(S,EN.spots(S,i,'settle'),v=>vScore(S,v)).forEach(v=>out.push({t:'place',kind:'settle',i:v}));
  const dev=P.dev.filter(d=>d.n<S.turnNo).map(d=>d.t);
  if(!S.devPlayed){const g=goal(S,i),miss=RES.filter(r=>P.res[r]<(g[r]||0));
   if(dev.includes('knight')&&(HX[S.board.robber].v.some(v=>S.bld[v]&&S.bld[v].p===i)||P.knights>=2))out.push({t:'play',c:'knight'});
   if(dev.includes('plenty')&&miss.length)out.push({t:'play',c:'plenty',a:miss[0],b:miss[1]||miss[0]});
   if(dev.includes('mono')){const r=RES.slice().sort((a,b)=>S.players.reduce((s,q,k)=>s+(k!==i?q.res[b]:0),0)-S.players.reduce((s,q,k)=>s+(k!==i?q.res[a]:0),0))[0];if(S.players.reduce((s,q,k)=>s+(k!==i?q.res[r]:0),0)>=3)out.push({t:'play',c:'mono',r})}
   if(dev.includes('road')&&!EN.spots(S,i,'settle').length)out.push({t:'play',c:'road'});}
  const noSpot=!EN.spots(S,i,'settle').length;
  if(can('road')&&noSpot&&P.left.road>0&&P.left.settle>0)roadPick(S,i).slice(0,2).forEach(e=>out.push({t:'place',kind:'road',i:e}));
  if(can('dev')&&S.deck.length&&(!EN.spots(S,i,'city').length||P.res.ore>=4))out.push({t:'buy'});
  // ruilen met de bank richting het doel
  const g=goal(S,i),miss=RES.filter(r=>P.res[r]<(g[r]||0));
  if(miss.length)RES.forEach(r=>{const k=EN.rate(S,i,r);if(P.res[r]-(g[r]||0)>=k)out.push({t:'bank',g:r,w:miss[0]})});
  out.push({t:'end'});return out}
 }
 return out;
};
}

/* ---------------- Tegelrummy ---------------- */
{
const G=ENG.rummy;
function findSets(rack){
 const out=[];const r=rack.slice();
 // groepen
 const byN={};r.filter(i=>i<104).forEach(i=>{const t=G.tile(i);(byN[t.n]=byN[t.n]||{})[t.c]=i});
 Object.values(byN).forEach(m=>{const ids=Object.values(m);if(ids.length>=3)out.push(ids)});
 // series per kleur, langste stukken van 3+
 for(let c=0;c<4;c++){const have={};r.filter(i=>i<104&&G.tile(i).c===c).forEach(i=>have[G.tile(i).n]=i);
  let run=[];for(let n=1;n<=14;n++){if(have[n]!=null)run.push(have[n]);else{if(run.length>=3)out.push(run);run=[]}}}
 return out;
}
function plan(S,i){
 const P=S.players[i];let rack=P.rack.slice();const newSets=[];
 const sets=findSets(rack).sort((a,b)=>b.length-a.length);
 sets.forEach(s=>{if(s.every(x=>rack.includes(x))){newSets.push(s.slice());rack=rack.filter(x=>!s.includes(x))}});
 // jokers: maak een set van 2 + joker
 const jk=rack.filter(x=>x>=104);
 if(jk.length){const nat=rack.filter(x=>x<104);outer:for(let a=0;a<nat.length;a++)for(let b=a+1;b<nat.length;b++){const s=[nat[a],nat[b],jk[0]];if(G.setInfo(s).ok){newSets.push(s);rack=rack.filter(x=>!s.includes(x));break outer}}}
 const table=S.table.map(s=>s.slice());
 if(P.opened||newSets.reduce((s,x)=>s+G.setInfo(x).value,0)>=30){
  let all=[...table,...newSets];
  if(P.opened){let moved=true;while(moved){moved=false;for(const t of rack.slice()){for(const s of all){const n=[...s,t];if(G.setInfo(n).ok){s.push(t);rack=rack.filter(x=>x!==t);moved=true;break}}}}}
  else{let moved=true;while(moved){moved=false;for(const t of rack.slice()){for(const s of newSets){const n=[...s,t];if(G.setInfo(n).ok){s.push(t);rack=rack.filter(x=>x!==t);moved=true;break}}}}all=[...table,...newSets]}
  if(rack.length<P.rack.length)return all;
 }
 return null;
}
BOTS.rummy=(S,i)=>{if(S.turn!==i)return [];const p=plan(S,i);const out=[];if(p)out.push({t:'play',table:p});out.push({t:'draw'});return out};
}

/* ---------------- Ezelen ---------------- */
{
const G=ENG.ezel;
BOTS.ezel=(S,i)=>{
 if(S.turn!==i)return [];const P=S.players[i],out=[];
 const tryTile=(src,t)=>{if(t==null)return;S.mid.forEach((p,k)=>{if(G.onMid(t,p))out.push({t:'play',src,dst:'mid',i:k})});if(t===1)out.push({t:'play',src,dst:'new'});
  S.players.forEach((q,k)=>{if(k!==i&&G.onPlayer(t,q.open))out.push({t:'play',src,dst:'p',i:k})})};
 if(S.hand!=null)tryTile('hand',S.hand);
 tryTile('open',G.top(P.open));
 if(S.hand==null){if(S.phase==='berg'&&S.pool.length)out.push({t:'pick',i:Math.floor(Math.random()*S.pool.length)});else out.push({t:'flip'})}
 else out.push({t:'dump'});
 return out;
};
}

/* ---------------- Eentje! ---------------- */
{
const G=ENG.eentje;
BOTS.eentje=(S,i)=>{
 if(S.turn!==i)return [];const P=S.players[i],out=[];
 const cnt=[0,0,0,0];P.hand.forEach(id=>{const c=G.card(id).c;if(c>=0)cnt[c]++});const col=cnt.indexOf(Math.max(...cnt));
 const uno=P.hand.length===2&&Math.random()<.92;
 const n=S.players.length,nx=((S.turn+S.dir)%n+n)%n,danger=S.players[nx].hand.length<=2;
 const cand=(S.step==='drawn'?[S.drawn]:P.hand).filter(id=>G.fits(S,id));
 const score=id=>{const k=G.card(id);let s=0;if(k.c<0)s=-5+(danger&&k.v==='w4'?20:0);else{s=typeof k.v==='number'?k.v/10:2;if(danger&&k.v!=='rev'&&typeof k.v!=='number')s+=10;if(k.c===col)s+=1}return s+Math.random()*.2};
 cand.sort((a,b)=>score(b)-score(a)).forEach(id=>out.push({t:'play',id,color:col,uno}));
 out.push(S.step==='drawn'?{t:'pass'}:{t:'draw'});return out;
};
}

/* ---------------- Tien Fasen ---------------- */
{
const G=ENG.fase;
function tryLay(P){
 const spec=G.PH[P.phase];
 const options=(k,m,used)=>{const avail=P.hand.filter(i=>!used.has(i)&&!G.card(i).s);const wild=avail.filter(i=>G.card(i).w),nat=avail.filter(i=>!G.card(i).w);const res=[];
  if(k==='set'||k==='col'){const by={};nat.forEach(i=>{const c=G.card(i),key=k==='set'?c.n:c.c;(by[key]=by[key]||[]).push(i)});
   Object.values(by).sort((a,b)=>b.length-a.length).forEach(g=>{if(g.length+wild.length>=m)res.push([...g.slice(0,m),...wild.slice(0,Math.max(0,m-g.length))])})}
  else for(let s=1;s+m-1<=12;s++){const pick=[];let w=0;for(let v=s;v<s+m;v++){const c=nat.find(i=>G.card(i).n===v&&!pick.includes(i));if(c!=null)pick.push(c);else w++}if(w<=wild.length&&pick.length)res.push([...pick,...wild.slice(0,w)])}
  return res};
 const rec=(gi,used,acc)=>{if(gi===spec.length)return used.size<P.hand.length?acc:null;
  for(const g of options(spec[gi][0],spec[gi][1],used)){const u=new Set(used);g.forEach(x=>u.add(x));const r=rec(gi+1,u,[...acc,g]);if(r)return r}return null};
 return rec(0,new Set(),[]);
}
function useful(P,id){const c=G.card(id);if(c.w)return 100;if(c.s)return -10;const spec=G.PH[Math.min(9,P.phase)];let u=0;
 spec.forEach(([k])=>{P.hand.forEach(j=>{if(j===id)return;const d=G.card(j);if(d.w||d.s)return;if(k==='set'&&d.n===c.n)u+=3;if(k==='col'&&d.c===c.c)u+=2;if(k==='run'){if(d.n===c.n){if(!spec.some(x=>x[0]==='set'))u-=6}else if(Math.abs(d.n-c.n)<=3)u+=1}})});return u}
BOTS.fase=(S,i)=>{
 if(S.turn!==i)return [];const P=S.players[i],out=[];
 if(S.step==='draw'){const top=S.discard[S.discard.length-1];if(top!=null&&!G.card(top).s&&!P.done&&Math.random()<.85){const H={...P,hand:[...P.hand,top]},ut=useful(H,top),worst=Math.min(...P.hand.map(c=>useful(H,c)));if(ut>=(G.PH[P.phase].some(x=>x[0]==='run')?2:4)&&ut>worst)out.push({t:'draw',from:'disc'})}out.push({t:'draw',from:'deck'});return out}
 if(!P.done){const g=tryLay(P);if(g)out.push({t:'lay',groups:g})}
 if(P.done&&P.hand.length>1)for(const c of P.hand){let hit=false;S.laid.forEach((L,g)=>{if(!hit&&G.valid(L.k,L.ids.concat([c]),1)){out.push({t:'hit',g,ids:[c]});hit=true}})}
 const others=S.players.map((p,k)=>k).filter(k=>k!==i&&!S.skipped.includes(k)).sort((a,b)=>S.players[b].phase-S.players[a].phase||S.players[a].hand.length-S.players[b].hand.length);
 P.hand.slice().sort((a,b)=>P.done?(G.pts(b)-G.pts(a)):(useful(P,a)-useful(P,b))).forEach(c=>{if(G.card(c).s){if(others.length)out.push({t:'discard',id:c,p:others[0]})}else out.push({t:'discard',id:c})});
 return out;
};
}

/* ---------------- Beverdam ---------------- */
{
const G=ENG.bever;
const val=c=>G.isNum(c)?c:5;
BOTS.bever=(S,i)=>{
 const P=S.players[i];
 if(S.phase==='peek')return S.ready[i]?[]:[{t:'ready'}];
 if(S.turn!==i||S.phase!=='turn')return [];
 const out=[],h=P.hand.map(val),mx=h.indexOf(Math.max(...h)),sum=h.reduce((a,b)=>a+b,0);
 if(S.step==='start'){const top=S.discard[S.discard.length-1];
  if(S.knocker==null&&S.turnNo>=S.players.length*2&&sum<=8+Math.random()*4)out.push({t:'knock'});
  if(G.isNum(top)&&top<h[mx]-2)out.push({t:'disc'});out.push({t:'deck'});return out}
 if(S.step==='two')return [{t:'deck'}];
 if(S.step==='drawn'){if(S.from==='disc'||S.drawn<h[mx])out.push({t:'swap',i:mx});out.push({t:'toss'});return out}
 if(S.step==='action'){
  if(S.drawn==='r'&&h[mx]>=5){const q=(i+1)%S.players.length;out.push({t:'trade',i:mx,p:q,j:Math.floor(Math.random()*4)})}
  if(S.drawn==='t')out.push({t:'twice'});
  if(S.drawn==='k')out.push({t:'peek',i:Math.floor(Math.random()*4)});
  out.push({t:'toss'});return out}
 return out;
};
}
globalThis.BOTS=BOTS;
}

  for(y=r-2;y<=r+2;y++)for(x=c-2;x<=c+2;x++)if(y>=0&&y<H&&x>=0&&x<W){q=y*W+x;if(op[q]||own[q])continue;if(mine[q]){op[q]=1;own[q]=p;sc[p]++;got++}else flood(q)}
  last=k;sfx(got?'win':'ok');msg='💥 '+name(p)+(p===1&&mode==='cpu'?' gooide':' gooide')+' de bom en vond '+got+(got===1?' mijn.':' mijnen.');endCheck();if(!over)turn=other(p)}

 /* ---- computer ---- */
 function analyze(deep){var S={},Mi={},cons=[],k,ch=true,loops=0;
  for(k=0;k<N;k++)if(op[k]&&!own[k]&&num[k]>0){var u=[],kn=0;nb(k).forEach(function(j){if(own[j])kn++;else if(!op[j])u.push(j)});if(u.length)cons.push({c:u,n:num[k]-kn})}
  while(ch&&loops++<40){ch=false;
   cons.forEach(function(o){var c2=[],n2=o.n;o.c.forEach(function(j){if(Mi[j])n2--;else if(!S[j])c2.push(j)});o.c=c2;o.n=n2});
   cons=cons.filter(function(o){return o.c.length});
   cons.forEach(function(o){if(o.n===o.c.length)o.c.forEach(function(j){if(!Mi[j]){Mi[j]=1;ch=true}});else if(o.n===0)o.c.forEach(function(j){if(!S[j]){S[j]=1;ch=true}})});
   if(!ch&&deep){for(var a=0;a<cons.length&&!ch;a++)for(var b=0;b<cons.length&&!ch;b++){var A=cons[a],B=cons[b];if(a===b||A.c.length>=B.c.length)continue;
     if(!A.c.every(function(j){return B.c.indexOf(j)>-1}))continue;var d=B.c.filter(function(j){return A.c.indexOf(j)<0}),dn=B.n-A.n;
     if(dn===d.length){d.forEach(function(j){Mi[j]=1});ch=true}else if(dn===0){d.forEach(function(j){S[j]=1});ch=true}}}}
  var P={},fr={},others=[],exp=0,rem=left()-Object.keys(Mi).length;
  cons.forEach(function(o){var p=o.n/o.c.length;o.c.forEach(function(j){fr[j]=1;P[j]=Math.max(P[j]||0,p)})});
  Object.keys(fr).forEach(function(j){if(!Mi[j]&&!S[j])exp+=P[j]});
  for(k=0;k<N;k++)if(!op[k]&&!own[k]&&!Mi[k]&&!S[k]&&!fr[k])others.push(k);
  var dens=others.length?Math.max(0,Math.min(1,(rem-exp)/others.length)):0;
  others.forEach(function(j){P[j]=dens});Object.keys(Mi).forEach(function(j){P[j]=1});Object.keys(S).forEach(function(j){P[j]=0});
  return {Mi:Object.keys(Mi).map(Number),P:P}}
 function cpuPick(){var a=analyze(lv>=2),cand=[],k,best=-1;
  if(lv===0&&Math.random()<.4){for(k=0;k<N;k++)if(!op[k]&&!own[k])cand.push(k);return {k:pick(cand)}}
  if(a.Mi.length&&(lv>0||Math.random()<.6))return {k:pick(a.Mi)};
  if(lv>=1&&canBomb(2)){var bb=-1,bv=0,y,x,q;for(k=0;k<N;k++){var r=k/W|0,c=k%W,v=0;for(y=r-2;y<=r+2;y++)for(x=c-2;x<=c+2;x++)if(y>=0&&y<H&&x>=0&&x<W){q=y*W+x;if(!op[q]&&!own[q])v+=a.P[q]||0}if(v>bv){bv=v;bb=k}}
   if(bb>-1&&bv>=(lv===2?3:3.5)&&(sc[1]-sc[2]>=3||sc[1]>=18))return {k:bb,bomb:true}}
  for(k=0;k<N;k++)if(!op[k]&&!own[k]){var p=(a.P[k]==null?.2:a.P[k])+Math.random()*(lv===0?.35:.02);if(p>best){best=p;cand=[k]}}
  return {k:cand[0]}}
 function cpuGo(){if(mode!=='cpu'||over||turn!==2)return;busy=true;draw();setTimeout(cpuStep,750)}

  if(m.bomb)doBomb(m.k,2);else{var hit=move(m.k,2);msg=hit?(over?'':'De computer vond een mijn en is nog een keer.'):''}
  if(!over&&turn===2){draw();setTimeout(cpuStep,750)}else{busy=false;draw()}}

 /* ---- alleen spelen ---- */
 function secs(){return t0?Math.floor((Date.now()-t0)/1000):0}
 function lose(k){boom=k;over=true;res=-1;clearInterval(tm);draw()}
 function soloWin(){var n=0,k;for(k=0;k<N;k++)if(op[k])n++;if(n===N-M){over=true;res=1;clearInterval(tm);var s=secs(),bst=data.mfBest=data.mfBest||{};msg=(!bst[si]||s<bst[si])?'Nieuw record!':'Record: '+bst[si]+' s';if(!bst[si]||s<bst[si]){bst[si]=s;save()}for(k=0;k<N;k++)if(mine[k])fl[k]=1;confetti(1)}}
 function soloTap(k,flag){if(over)return;
  if(flag||fm){if(op[k])return;fl[k]=fl[k]?0:1;draw();return}

  if(first){place(nb(k).concat(k));first=false;t0=Date.now();tm=setInterval(function(){var e=$('#mft');if(!e){clearInterval(tm);return}if(!over)e.textContent=secs()},1000)}

  else if(mine[k])return lose(k);else flood(k);
  last=k;soloWin();draw()}

 /* ---- tikken ---- */
 function tap(k){if(solo)return soloTap(k,false);if(over||busy||!isHuman(turn))return;

  msg=hit?(over?'':name(p)+(mode==='cpu'?' vond een mijn! Je bent nog een keer.':' vond een mijn en is nog een keer.')):(mode==='twee'?name(turn)+' is aan de beurt.':'');
  draw();cpuGo()}

 function cell(k){var cls='mf-c',h='',pv=false;

  if(own[k]){cls+=' f';h=mfFlag(MFC[own[k]])}

  if(k===last&&!solo)cls+=' l';if(pv)cls+=' pv';
  return '<button class="'+cls+'" data-k="'+k+'" aria-label="rij '+((k/W|0)+1)+' kolom '+(k%W+1)+'">'+h+'</button>'}
 function pan(p){var on=!over&&turn===p,cb=canBomb(p)&&on&&isHuman(p)&&!busy,av=mode==='cpu'?(p===1?'🙂':'🤖'):(p===1?'🔴':'🔵'),
   st=over?(res===p?'🏆 winnaar!':''):on?(busy&&p===2?'denkt na…':'aan de beurt'):(bomb[p]?'':'bom gebruikt');
  return '<div class="mf-p mf-'+(p===1?'r':'b')+(on?' on':'')+'"><div class="mf-av">'+av+'</div><div class="mf-nm"><b>'+name(p)+'</b><small>'+st+'</small></div><div class="mf-sc">'+mfFlag(MFC[p])+'<b>'+sc[p]+'</b></div><button class="mf-bomb'+(bm&&on?' act':'')+'" data-bomb="'+p+'"'+(cb?'':' disabled')+' aria-label="Bom gooien" title="'+(bomb[p]?'Bom: alleen als je achter staat':'De bom is al gebruikt')+'">'+(bomb[p]?bombSvg(34):'✖️')+'</button></div>'}
 function endBox(){var t,s='';
  if(solo){t=res===1?'Gewonnen! 🎉':'Boem! 💥';s=res===1?'Alle mijnen ontweken in '+secs()+' seconden. '+msg:'Je raakte een mijn.'}
  else{t=mode==='cpu'?(res===1?'Jij wint! 🎉':'De computer wint'):name(res)+' wint! 🎉';s=(quit?name(other(res))+' gaf op. ':'')+'Rood '+sc[1]+' – '+sc[2]+' Blauw'}
  return '<div class="mf-end"><div><h2>'+t+'</h2><p class="sub">'+s+'</p><button class="btn" id="mfa">Nog een keer</button><button class="btn alt" id="mfv">Bekijk het bord</button><button class="btn alt" id="mfm">Andere spelvorm</button></div></div>'}
 function draw(){var nf=fl.filter(Boolean).length,mid;
  if(solo)mid=(over?'':'Tik om te openen. Houd ingedrukt, rechtsklik of zet 🚩 aan voor een vlag.')+(msg&&!over?'<br>'+msg:'');
  else mid='Nog <b>'+left()+'</b> mijnen · <b>'+WIN+'</b> nodig om te winnen'+(bm?'<br><b>💣 Kies waar de bom moet vallen.</b>':'')+(msg?'<br>'+msg:'');
  var panels=solo?'<div class="mf-p mf-r on"><div class="mf-av">🙋</div><div class="mf-nm"><b>Jij</b><small>'+(over?(res===1?'🏆 gewonnen':'💥 boem'):'')+'</small></div><div class="mf-sc">'+mfFlag(MFC[1])+'<b>'+(M-nf)+'</b></div><div class="mf-sc">⏱️<b id="mft">'+secs()+'</b></div><button class="mf-bomb'+(fm?' act':'')+'" id="mffm" aria-pressed="'+fm+'" aria-label="Vlag-stand" title="Vlag-stand">🚩</button></div>':pan(2)+pan(1);
  app.innerHTML=OTOP+'<h1>Mijnenveger Flags</h1><div class="mf'+(solo?' solo':'')+'">'+panels+'<div class="mf-m">'+mid+'</div><div class="mf-bw"><div class="mf-bd" id="mfb" style="grid-template-columns:repeat('+W+',minmax(0,1fr))">'+Array.apply(null,Array(N)).map(function(_,k){return cell(k)}).join('')+'</div>'+(over&&!hideEnd?endBox():'')+'</div></div><div class="mfbtns">'+
   (over?'<button class="btn" id="mfa2">Nog een keer</button>':(solo?'':'<button class="btn rs" id="mfr">'+(rz?'Zeker weten? Tik nog eens':'Opgeven')+'</button>')+'<button class="btn alt" id="mfn">Nieuw spel</button>')+'<button class="btn alt" id="mfm2">Andere spelvorm</button></div>';
  var bye=function(){clearInterval(tm);over=true},again=function(){bye();mfPlay(mode)},menu=function(){bye();mijnenFlags()};
  $('#bk').onclick=menu;$('#mfm2').onclick=menu;
  if($('#mfa'))$('#mfa').onclick=again;if($('#mfa2'))$('#mfa2').onclick=again;if($('#mfn'))$('#mfn').onclick=again;if($('#mfm'))$('#mfm').onclick=menu;
  if($('#mfv'))$('#mfv').onclick=function(){hideEnd=true;draw()};
  if($('#mfr'))$('#mfr').onclick=function(){if(busy)return;if(!rz){rz=true;draw();return}quit=true;over=true;res=mode==='cpu'?2:other(turn);bm=false;draw()};
  if($('#mffm'))$('#mffm').onclick=function(){fm=!fm;draw()};
  document.querySelectorAll('[data-bomb]').forEach(function(b){b.onclick=function(){var p=Number(b.dataset.bomb);if(p!==turn||!canBomb(p)||busy)return;bm=!bm;bt=-1;msg='';draw()}});
  var bd=$('#mfb');
  bd.onclick=function(e){var t=e.target.closest('[data-k]');if(!t)return;if(lpDone){lpDone=false;return}tap(Number(t.dataset.k))};

   bd.onpointerdown=function(e){if(e.pointerType==='mouse')return;var t=e.target.closest('[data-k]');if(!t)return;lpDone=false;clearTimeout(lp);lp=setTimeout(function(){lpDone=true;soloTap(Number(t.dataset.k),true);try{navigator.vibrate&&navigator.vibrate(30)}catch(x){}},420)};
   bd.onpointerup=bd.onpointercancel=bd.onpointerleave=function(){clearTimeout(lp)}}}
 draw();cpuGo()}

async function commitOnline(fn,quiet){

 const ref=docRef(code),base=S&&S.v!=null?clone(S):null;let opt=null;
 if(base){const c=clone(base);let e;try{e=fn(c)}catch(x){e='Er ging iets mis.'}if(e){if(!quiet)toast(e);writing=false;render();return false}c.v=(c.v||0)+1;opt=c;S=c;onState()}
 else render();
 try{
  const snap=await ref.get();if(!snap.exists){toast('Dit spel bestaat niet meer.');return false}
  const remote=JSON.parse(snap.data().json);let out;
  if(opt&&remote.v===base.v)out=opt;
  else{out=remote;const e=fn(out);if(e){if(!quiet)toast(e);S=remote;return false}out.v=(remote.v||0)+1}
  await ref.set(wrapDoc(out));S=out;ok=true;ping(out.v);
 }catch(e){toast(e&&e.code==='invalid_argument'?'Je mag dit spel niet wijzigen. Vraag de eigenaar je als bewerker toe te voegen.':'Opslaan lukte niet. Probeer het nog eens.');try{const s2=await ref.get();if(s2.exists)S=JSON.parse(s2.data().json)}catch(x){}}
 finally{writing=false;onState()}

}

 for(const i of order){if(!S.players[i].bot)continue;for(const act of B(S,i)){const c=clone(S);if(!ENG[gid].act(c,i,act))return {i,act}}}

function scheduleBots(){

 if(!S.players.some(p=>p.bot))return;
 if(mode==='online'&&S.host!==myId)return;

function subscribe(c){

function embRuntime(src){

  get(t,p){
   if(p==='querySelector')return s=>root.querySelector(s);
   if(p==='querySelectorAll')return s=>root.querySelectorAll(s);
   if(p==='getElementById')return id=>root.getElementById(id);
   if(p==='body')return body;
   if(p==='documentElement')return host;
   if(p==='activeElement')return root.activeElement;

}

}
function embClose(){
 Object.values(EMBRT).forEach(r=>{try{r.api.leave()}catch(e){}const a=r.root.getElementById('app');if(a)a.innerHTML='';r.root.querySelectorAll('.cf,.toast').forEach(x=>x.remove());r.host.hidden=true});
 embCur=null;
}
function vEmbed(){
 const g=cat(embCur.id);
 return `<div class="gtop ebar"><button class="ib" data-a="home" aria-label="Terug naar de Spelkast">‹</button><div class="ttl">${esc(g.name)}</div>${Array.isArray(g.emb.key)?`<button class="ib" data-a="sheet" data-v="embvar">Kies</button>`:''}${g.emb.kids?`<button class="ib" data-a="sheet" data-v="kidsset">Instellingen</button>`:''}</div>`;
}
function embSheet(){
 const g=cat(embCur.id);
 if(sheet==='embvar')return shell(g.name,`<div class="dl">${g.emb.key.map(([k,l])=>`<button class="btn ${embCur.variant===k?'sea':'alt'}" data-a="embvar" data-v="${k}">${esc(l)}</button>`).join('')}</div>`,!!embCur.variant);
 if(sheet==='kidsset'){const K=EMBRT.kk&&EMBRT.kk.api;if(!K)return '';
  return shell('Instellingen',`<span class="lbl">Hoe moeilijk?</span><p class="note">Geldt voor galgje, kleurencode, rekenrace, hoger of lager, woorden schrijven en het raadsel.</p><div class="seg">${[2,3,4].map(n=>`<button class="${K.groep()===n?'on':''}" data-a="kkgroep" data-v="${n}">Groep ${n}</button>`).join('')}</div>
  <div class="seg"><button class="${K.VL()?'on':''}" data-a="kkvl">Voorlezen ${K.VL()?'aan':'uit'}</button><button class="${K.SND()?'on':''}" data-a="kksnd">Geluidjes ${K.SND()?'aan':'uit'}</button></div>
  <button class="btn" data-a="kkre">Klaar, opnieuw beginnen</button>`)}
 return '';
}
function embClick(a,v){
 const K=EMBRT.kk&&EMBRT.kk.api;
 switch(a){
 case 'embvar':sheet=null;embLaunch(embCur.id,v);return true;
 case 'kkgroep':K.setGroep(+v);render();return true;
 case 'kkvl':K.setVL(!K.VL());render();return true;
 case 'kksnd':K.setSnd(!K.SND());render();return true;
 case 'kkre':sheet=null;embLaunch(embCur.id,embCur.variant);return true;
 }
 return false;
}
/* ---------- volgorde op de hoofdpagina: alfabetisch, vaak gespeeld (5x of meer) bovenaan ---------- */
function opens(){try{return JSON.parse(ls.get('spelkast-opens')||'{}')||{}}catch(e){return {}}}
function countOpen(id){const o=opens();o[id]=(o[id]||0)+1;ls.set('spelkast-opens',JSON.stringify(o))}
function sortedCatalog(){const o=opens();const fav=c=>(o[c.id]||0)>=5;
 return CATALOG.slice().sort((a,b)=>{const fa=fav(a),fb=fav(b);if(fa!==fb)return fa?-1:1;if(fa&&o[b.id]!==o[a.id])return o[b.id]-o[a.id];return a.name.localeCompare(b.name,'nl',{sensitivity:'base'})})}
const embIcon=g=>`<svg viewBox="0 0 104 104" aria-hidden="true"><rect x="6" y="6" width="92" height="92" rx="24" fill="${g.emb.kids?'#fde3ec':'#dfe9f6'}"/><text x="52" y="70" text-anchor="middle" font-size="50">${g.emb.icon}</text></svg>`;

window.addEventListener('hashchange',route);
route();
(async()=>{try{const c=window.claude;if(c&&c.use)c.use('room').then(r=>{room=r;if(r&&code&&mode==='online')joinRoom(code)}).catch(()=>{});db=c&&c.use?await c.use('db'):null}catch(e){db=null}dbState=db?'ok':'none';if(view==='menu')render()})();
}
</script>
